estioner: Second question: could you give an example of how feelings affect portions of the body and the sensations of the body?\n\nRa: I am Ra. It is nearly impossible to speak generally of these mechanisms, for each entity of proper seniority has its own programming. Of the less aware entities we may say that the connection will often seem random as the higher self continues producing catalyst until a bias occurs. In each programmed individual the sensitivities are far more active and, as we have said, that catalyst not used fully by the mind and spirit is given to the body.\n\nThus you may see in this entity the numbing of the arms and the hands signifying this entity’s failure to surrender to the loss of control over the life. Thus this drama is enacted in the physical distortion complex.\n\nIn the questioner we may see the desire not to be carrying the load it carries given as physical manifestation of the soreness of those muscles for carrying used. That which is truly needed to be carried is a pre-incarnative responsibility which seems highly inconvenient.\n\nIn the case of the scribe we see a weariness and numbness of feelings ensuing from lack of using catalyst designed to sensitize this entity to quite significant influxes of unfamiliar distortion complexes of the mental/emotional and spiritual level. As the numbness removes itself from the higher or more responsive complexes the bodily complex distortions will vanish. This is true also of the other examples.\n\nWe would note at this time that the totally efficient use of catalyst upon your plane is extremely rare.","74.11":"74.11 Questioner: Now, what I am trying to get at is how these disciplines affect the energy centers and the power, shall I say, of the white magician. Could you, will you tell me how that works?\n\nRa: I am Ra. The heart of the discipline of the personality is threefold. One, know yourself. Two, accept yourself. Three, become the Creator.\n\nThe third step is that step which, when accomplished, renders one the most humble servant of all, transparent in personality and completely able to know and accept other-selves. In relation to the pursuit of the magical working the continuing discipline of the personality involves the adept in knowing itself, accepting itself, and thus clearing the path towards the great indigo gateway to the Creator. To become the Creator is to become all that there is. There is then no personality in the sense with which the adept begins its learn/teaching. As the consciousness of the indigo ray becomes more crystalline, more work may be done; more may be expressed from intelligent infinity.","76.9":"76.9 Questioner: Is there, in Ra’s opinion, any present-day value for the reuse of the tarot as an aid in the evolutionary process?\n\nRa: I am Ra. We shall repeat information. It is appropriate to study one form of constructed and organized distortion of the archetypical mind in depth in order to arrive at the position of being able to become and to experience archetypes at will. You have three basic choices. You may choose astrology, the twelve signs, as you call these portions of your planet’s energy web, and what has been called the ten planets. You may choose the tarot with its twenty-two so-called Major Arcana. You may choose the study of the so-called Tree of Life with its ten Sephiroth and the twenty-two relationships between the stations.\n\nIt is well to investigate each discipline, not as a dilettante, but as one who seeks the touchstone, one who wishes to feel the pull of the magnet. One of these studies will be more attractive to the seeker. Let the seeker then investigate the archetypical mind using, basically, one of these three disciplines. After a period of study, the discipline mastered sufficiently, the seeker may then complete the more important step: that is, the moving beyond the written in order to express in an unique fashion its understanding, if you may again pardon the noun, of the archetypical mind.","78.19":"78.19 Questioner: So the original, the first evolution then was planned by the Logos but the first distortion was not extended to the product. At some point this first distortion was extended and the first service-to-self polarity emerged. Is this correct and if so, could you tell me the history of this process and emergence?\n\nRa: I am Ra. As proem let me state that the Logoi always conceived of themselves as offering free will to the sub-Logoi in their care. The sub-Logoi had freedom to experience and experiment with consciousness, the experiences of the body, and the illumination of the spirit. That having been said, we shall speak to the point of your query.\n\nThe first Logos to instill what you now see as free will, in the full sense, in its sub-Logoi came to this creation due to contemplation in depth of the concepts or possibilities of conceptualizations of what we have called the significators. The Logos posited the possibility of the mind, the body, and the spirit as being complex. In order for the significator to be what it is not, it then must be granted the free will of the Creator. This set in motion a quite lengthy, in your terms, series of Logoi improving or distilling this seed thought. The key was the significator becoming a complex.","82.10":"82.10 Questioner: Why does this partaking in the original thought have a gradient radially outward? That’s the way I understand your statement.\n\nRa: I am Ra. This is the plan of the One Infinite Creator. The One Original Thought is the harvest of all previous, if you would use this term, experience of the Creator by the Creator. As It decides to know Itself It generates Itself into that plenum, full of the glory and the power of the One Infinite Creator which is manifested to your perceptions as space or outer space. Each generation of this knowing begets a knowing which has the capacity, through free will, to choose methods of knowing Itself. Therefore, gradually, step by step, the Creator becomes that which may know Itself, and the portions of the Creator partake less purely in the power of the original word or thought. This is for the purpose of refinement of the one original thought. The Creator does not properly create as much as It experiences Itself.","84.20":"84.20 Questioner: Then, with respect to the green, blue, and indigo transfers of energy: How would the mechanism for these transfers differ in making them possible or setting the groundwork for them than the orange ray? I know this is very difficult to ask and I may not be making any sense, but what I am trying to do is get to an understanding of the foundation for transfers in each of the rays and the preparations for the transfers, you might say, or the fundamental requirements and biases and potentials for these transfers. Could you expand on that for me please? I am sorry for the poor question.\n\nRa: I am Ra. We would take a moment to state in reply to a previous comment that we shall answer each query whether or not it has been previously covered for not to do so would be to baffle the flow of quite another transfer of energy.\n\nTo respond to your query we firstly wish to agree with your supposition that the subject you now query upon is a large one, for in it lies an entire system of opening the gateway to intelligent infinity. You may see that some information is necessarily shrouded in mystery by our desire to preserve the free will of the adept. The great key to blue, indigo, and finally, that great capital of the column of sexual energy transfer, violet energy transfers, is the metaphysical bond or distortion which has the name among your peoples of unconditional love. In the blue-ray energy transfer the quality of this love is refined in the fire of honest communication and clarity; this, shall we say, normally, meaning in general, takes a substantial portion of your space/time to accomplish although there are instances of matings so well refined in previous incarnations and so well remembered that the blue ray may be penetrated at once. This energy transfer is of great benefit to the seeker in that all communication from this seeker is, thereby, refined and the eyes of honesty and clarity look upon a new world. Such is the nature of blue-ray energy and such is one mechanism of potentiating and crystallizing it.\n\nAs we approach indigo-ray transfer we find ourselves in a shadowland where we cannot give you information straight out or plain, for this is seen by us to be an infringement. We cannot speak at all of violet-ray transfer as we do not, again, desire to break the Law of Confusion.\n\nWe may say that these jewels, though dearly bought, are beyond price for the seeker and might suggest that just as each awareness is arrived at through a process of analysis, synthesis, and inspiration, so should the seeker approach its mate and evaluate each experience, seeking the jewel.","87.6":"87.6 Questioner: Would you expand upon the concept of the acquisition of polarity by this particular entity, and its use, specifically, of this polarity other than with the simple, obvious need for sixth-density harvest if this is possible, please?\n\nRa: I am Ra. We would. The nature of the densities above your own is that a purpose may be said to be shared by both positive and negative polarities. This purpose is the acquisition of the ability to welcome more and more the less and less distorted love/light and light/love of the One Infinite Creator. Upon the negative path the wisdom density is one in which power over others has been refined until it is approaching absolute power. Any force such as the force your group and those of Ra offer which cannot be controlled by the power of such a negative fifth-density mind/body/spirit complex then depolarizes the entity which has not controlled other-selves.\n\nIt is not within your conscious selves to stand against such refined power but rather it has been through the harmony, the mutual love, and the honest calling for aid from the forces of light which have given you the shield and buckler."};

var selected = null;
try {
  var saved = localStorage.getItem('selectedTraditions');
  if (saved) selected = JSON.parse(saved);
} catch(e) {}
if (!selected || !selected.length) {
  selected = DATA.traditions.map(function(_, i){ return i; });
}

var viewMode = 'single';
try {
  var savedMode = localStorage.getItem('viewMode');
  if (savedMode === 'all' || savedMode === 'single') viewMode = savedMode;
} catch(e) {}

var currentTopicIndex = 0;
var verseCache = {};

function saveSelected() {
  try { localStorage.setItem('selectedTraditions', JSON.stringify(selected)); } catch(e) {}
}
function saveViewMode() {
  try { localStorage.setItem('viewMode', viewMode); } catch(e) {}
}

function splitLines(raw) {
  var cleaned = raw.replace(/J\s*\n\s*ohn/g, 'John');
  return cleaned.split(/[\n;]+/).map(function(s){ return s.trim(); }).filter(Boolean);
}

function isBibleRefLine(s) { return /\d+:\d+/.test(s); }
function isLawOfOneRefLine(s) { return /Law of One\s+[\d.\-]+/.test(s); }
function isAcimRefLine(s) { return /^ACIM\s/.test(s); }

function fetchBibleVerse(ref, cb) {
  if (verseCache[ref]) { cb(verseCache[ref]); return; }
  fetch('https://bible-api.com/' + encodeURIComponent(ref) + '?translation=web')
    .then(function(r){ return r.json(); })
    .then(function(data){
      var text = (data && data.text) ? data.text.trim() : 'Verse text not found.';
      verseCache[ref] = text;
      cb(text);
    })
    .catch(function(){
      cb('Could not load verse text (network error). Reference: ' + ref);
    });
}

function highlight(text, term) {
  if (!term) return document.createTextNode(text);
  var span = document.createElement('span');
  var lower = text.toLowerCase();
  var lowerTerm = term.toLowerCase();
  var idx = 0, pos;
  while ((pos = lower.indexOf(lowerTerm, idx)) !== -1) {
    span.appendChild(document.createTextNode(text.slice(idx, pos)));
    var mark = document.createElement('mark');
    mark.textContent = text.slice(pos, pos + term.length);
    span.appendChild(mark);
    idx = pos + term.length;
  }
  span.appendChild(document.createTextNode(text.slice(idx)));
  return span;
}

function makeRefItem(label, onExpand) {
  var item = document.createElement('div');
  item.className = 'ref-item';
  var chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'ref-chip';
  chip.textContent = label;
  var box = document.createElement('div');
  box.className = 'verse-box';
  box.hidden = true;
  chip.addEventListener('click', function() {
    var wasHidden = box.hidden;
    box.hidden = !wasHidden;
    if (wasHidden && !box.dataset.loaded) {
      box.dataset.loaded = '1';
      onExpand(box);
    }
  });
  item.appendChild(chip);
  item.appendChild(box);
  return item;
}

function renderAnswerCard(traditionName, answerText, term) {
  var card = document.createElement('div');
  card.className = 'card';
  var h = document.createElement('h4');
  h.textContent = traditionName;
  card.appendChild(h);

  var lines = splitLines(answerText);

  if (traditionName === 'Bible Scriptures' && lines.length && lines.every(isBibleRefLine)) {
    var refWrap = document.createElement('div');
    refWrap.className = 'ref-list';
    lines.forEach(function(ref) {
      refWrap.appendChild(makeRefItem(ref, function(box) {
        box.textContent = 'Loading...';
        fetchBibleVerse(ref, function(text) { box.textContent = text; });
      }));
    });
    card.appendChild(refWrap);
    var note = document.createElement('p');
    note.className = 'api-note';
    note.textContent = 'Click a reference to load its full text (World English Bible, public domain, via bible-api.com).';
    card.appendChild(note);
  } else if (traditionName === 'Law of One Scriptures' && lines.length && lines.every(isLawOfOneRefLine)) {
    var refWrap2 = document.createElement('div');
    refWrap2.className = 'ref-list';
    lines.forEach(function(line) {
      var m = line.match(/Law of One\s+([\d.\-]+)/);
      var key = m ? m[1] : null;
      refWrap2.appendChild(makeRefItem(line, function(box) {
        var text = key && LO_DATA[key] ? LO_DATA[key] : 'Full text not found for this reference.';
        box.textContent = text;
      }));
    });
    card.appendChild(refWrap2);
    var note2 = document.createElement('p');
    note2.className = 'api-note';
    note2.textContent = 'Click a reference to load the full session excerpt (Law of One material, republished with permission from L/L Research via lawofone.info).';
    card.appendChild(note2);
  } else if (traditionName === 'ACIM Scriptures' && lines.length && lines.every(isAcimRefLine)) {
    var refWrap3 = document.createElement('div');
    refWrap3.className = 'ref-list';
    lines.forEach(function(line) {
      refWrap3.appendChild(makeRefItem(line, function(box) {
        box.innerHTML = '';
        box.appendChild(document.createTextNode('Full text isn\'t included here: A Course in Miracles\' copyright status is actively contested/enforced and there is no clear free-redistribution license, unlike the Bible or the Law of One material. You can look up this passage at '));
        var a = document.createElement('a');
        a.href = 'https://acim.org';
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = 'acim.org';
        box.appendChild(a);
        box.appendChild(document.createTextNode('.'));
      }));
    });
    card.appendChild(refWrap3);
    var note3 = document.createElement('p');
    note3.className = 'api-note';
    note3.textContent = 'Citations only \u2014 full text not reproduced due to copyright.';
    card.appendChild(note3);
  } else {
    var p = document.createElement('p');
    p.appendChild(highlight(answerText, term));
    card.appendChild(p);
  }
  return card;
}

function renderTraditionToggles() {
  var wrap = document.getElementById('traditionToggles');
  wrap.innerHTML = '';
  DATA.traditions.forEach(function(name, i) {
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'trad-chip' + (selected.indexOf(i) !== -1 ? ' on' : '');
    chip.textContent = name;
    chip.addEventListener('click', function() {
      var pos = selected.indexOf(i);
      if (pos !== -1) { selected.splice(pos, 1); } else { selected.push(i); }
      saveSelected();
      renderTraditionToggles();
      renderContent();
    });
    wrap.appendChild(chip);
  });
}

function renderSidebar(filterTerm) {
  var list = document.getElementById('topicList');
  list.innerHTML = '';
  DATA.topics.forEach(function(topic, i) {
    var term = (filterTerm || '').toLowerCase();
    if (term) {
      var haystack = (topic.category + ' ' + topic.question + ' ' + topic.answers.join(' ')).toLowerCase();
      if (haystack.indexOf(term) === -1) return;
    }
    var btn = document.createElement('button');
    btn.textContent = topic.category;
    btn.className = (viewMode === 'single' && i === currentTopicIndex ? 'active' : '');
    btn.addEventListener('click', function() {
      if (viewMode === 'all') {
        var el = document.getElementById('topic-' + i);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        currentTopicIndex = i;
        renderSidebar(document.getElementById('search').value);
        renderContent();
      }
    });
    list.appendChild(btn);
  });
}

function renderTopicBlock(topic, index, term) {
  var block = document.createElement('div');
  block.className = 'topic-block';
  block.id = 'topic-' + index;
  var h2 = document.createElement('h2');
  h2.textContent = topic.category;
  block.appendChild(h2);
  if (topic.question) {
    var q = document.createElement('p');
    q.className = 'question';
    q.textContent = topic.question;
    block.appendChild(q);
  }
  var cards = document.createElement('div');
  cards.className = 'cards';
  selected.slice().sort(function(a, b) { return a - b; }).forEach(function(idx) {
    cards.appendChild(renderAnswerCard(DATA.traditions[idx], topic.answers[idx], term));
  });
  block.appendChild(cards);
  return block;
}

function renderContent() {
  var term = document.getElementById('search').value;
  var content = document.getElementById('content');
  content.innerHTML = '';
  if (viewMode === 'all') {
    DATA.topics.forEach(function(topic, i) {
      content.appendChild(renderTopicBlock(topic, i, term));
    });
  } else {
    content.appendChild(renderTopicBlock(DATA.topics[currentTopicIndex], currentTopicIndex, term));
  }
}

document.getElementById('search').addEventListener('input', function(e) {
  renderSidebar(e.target.value);
});
document.getElementById('selectAllBtn').addEventListener('click', function() {
  selected = DATA.traditions.map(function(_, i){ return i; });
  saveSelected();
  renderTraditionToggles();
  renderContent();
});
document.getElementById('clearAllBtn').addEventListener('click', function() {
  selected = [];
  saveSelected();
  renderTraditionToggles();
  renderContent();
});
var showAllBtn = document.getElementById('showAllBtn');
function updateShowAllBtn() {
  showAllBtn.textContent = viewMode === 'all' ? 'Show Single Topic' : 'Show All Categories';
  showAllBtn.className = viewMode === 'all' ? 'toggle-on' : '';
}
showAllBtn.addEventListener('click', function() {
  viewMode = viewMode === 'all' ? 'single' : 'all';
  saveViewMode();
  updateShowAllBtn();
  renderSidebar(document.getElementById('search').value);
  renderContent();
});

renderTraditionToggles();
updateShowAllBtn();
renderSidebar('');
renderContent();
</script>
</body>
</html>
