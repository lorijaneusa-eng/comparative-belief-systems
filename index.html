<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparative Belief Systems</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e222b;
    --border: #2a2f3a;
    --text: #e8e9ec;
    --muted: #9aa3b2;
    --accent: #7c9eff;
    --accent2: #ffb27c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  header h1 {
    margin: 0 0 4px 0;
    font-size: 22px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 14px;
    align-items: center;
  }
  input[type="search"] {
    flex: 1;
    min-width: 220px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
  }
  select {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
  }
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    min-height: calc(100vh - 120px);
  }
  nav {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    max-height: calc(100vh - 120px);
  }
  nav button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 18px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    font-size: 13.5px;
  }
  nav button:hover { background: var(--panel2); }
  nav button.active {
    background: var(--panel2);
    border-left: 3px solid var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  main {
    padding: 24px 32px;
    overflow-y: auto;
  }
  .topic-header h2 {
    margin: 0 0 6px 0;
    font-size: 24px;
  }
  .topic-header .question {
    color: var(--accent2);
    font-size: 16px;
    margin-bottom: 20px;
  }
  .tradition-toggle-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }
  .chip {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    user-select: none;
  }
  .chip.on {
    background: var(--accent);
    color: #0f1115;
    border-color: var(--accent);
    font-weight: 600;
  }
  .answers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card h3 {
    margin: 0 0 8px 0;
    font-size: 14px;
    color: var(--accent);
  }
  .card p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
  }
  mark {
    background: var(--accent2);
    color: #0f1115;
    border-radius: 3px;
    padding: 0 2px;
  }
  .empty-state {
    color: var(--muted);
    padding: 40px;
    text-align: center;
  }
  .search-results-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .search-results-list li {
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
  }
  .search-results-list h3 {
    margin: 0 0 4px 0;
    font-size: 15px;
    cursor: pointer;
    color: var(--accent);
  }
  .search-results-list .q {
    color: var(--accent2);
    font-size: 12.5px;
    margin-bottom: 8px;
  }
  .search-results-list .snippet {
    font-size: 13px;
    color: var(--muted);
    margin: 2px 0;
  }
  .search-results-list .snippet b.tname { color: var(--text); }
  footer {
    padding: 18px 32px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    nav { max-height: 240px; border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>Comparative Belief Systems</h1>
  <p>A side-by-side reference comparing how different traditions answer the same big questions.</p>
  <div class="controls">
    <input type="search" id="searchInput" placeholder="Search topics, questions, or answers (e.g. 'reincarnation', 'grace', 'aliens')..." />
  </div>
</header>
<div class="layout">
  <nav id="topicNav"></nav>
  <main id="mainContent"></main>
</div>
<footer>Data compiled for personal study/reference. Not affiliated with or endorsed by any of the listed traditions.</footer>

<script>
const DATA = {"traditions":["Bible Scriptures","ACIM Scriptures","Law of One Scriptures","Metaphysical/ Mystical","Gnostic","Catholic","Fundamentalist (traditional)","Evangelical (traditional)","Jehovah's Witness","7th Day Adventeist","Latter Day Saints / Mormon (LDS)","Buddhism","Hinduism (Vedanta)","Eastern Orthodox","New Thought (Unity/Religious Science)"],"topics":[{"category":"Belief System Category","question":"","answers":["Christian","New Thought / Metaphysical","Metaphysical / Channeled","Metaphysical / Mystical","Christian (Esoteric / Gnostic)","Christian (Catholic)","Christian (Fundamentalist)","Christian (Evangelical)","Christian (Jehovah's Witness)","Christian (7th Day Adventist)","Christian (Latter Day Saints)","Eastern (Buddhism)","Eastern (Hinduism)","Christian (Eastern Orthodox)","New Thought"]},{"category":"Main Sacred Text","question":"","answers":["Bible (Old & New Testaments) Cross-references & concordances Historic creeds (Apostles', Nicene)","A Course in Miracles (Text, Workbook, Manual) Supplements: Psychotherapy; The Song of Prayer Clarification of Terms","The Law of One (The Ra Material) The Law of One: Books I-V Confederation channelings (L/L Research)","Varied metaphysical/mystical writings Seth Material; A Course in Miracles Hermetic texts (e.g., The Kybalion)","Gnostic Gospels Nag Hammadi Library Gospel of Thomas; Gospel of Philip; Pistis Sophia","Bible (incl. Deuterocanon) Sacred Tradition Catechism of the Catholic Church; Church Councils","Bible (KJV/other; verbally inerrant) Historic fundamentalist confessions The Fundamentals (1910-1915)","Bible (multiple translations) Statements of faith (e.g., Lausanne Covenant) Reformation creeds & confessions","New World Translation (Bible) Watchtower & Awake! magazines Watch Tower Society publications","Bible (Old & New Testaments) Writings of Ellen G. White 28 Fundamental Beliefs","Bible (KJV) Book of Mormon Doctrine & Covenants; Pearl of Great Price","Pali Canon (Tipitaka) Mahayana Sutras Dhammapada","Vedas & Upanishads Bhagavad Gita Brahma Sutras","Bible (Septuagint) + Holy Tradition Church Fathers & Ecumenical Councils Philokalia; liturgical texts","The Bible (reinterpreted) Science of Mind (E. Holmes) Lessons in Truth; writings of the Fillmores"]},{"category":"Creation & World","question":"Is the material world good?","answers":["Genesis 1:31 1 Timothy 4:4 Colossians 1:16","ACIM T-2.VIII.1 ACIM W-132.6","Law of One 13.7-13.13 Law of One 82.10","World may be lower vibration or illusion; goal is to see through appearances and transfigure experience via consciousness.","Material world is a flawed prison made by a lesser Demiurge; goal is escape to higher spiritual realms.","Created good by God from nothing (creatio ex nihilo); material world is inherently good and sacramental.","Created good by God but fallen; sharp separation between saved and unsaved; strong suspicion of secular culture.","Created good, fallen yet redeemable; emphasizes cultural engagement and transformation.","Created good by Jehovah; earth meant to be a paradise home for obedient humans.","Created good by God; the seventh-day Sabbath commemorates a literal six-day creation.","Created good by God; earth and matter are literal and will be renewed/perfected.","Impersonal cosmos with no creator God; universe arises through dependent origination and cycles of existence.","Creation is the play (lila) of Brahman; the world is real yet ultimately maya (appearance) veiling the one Reality.","Created good by God from nothing; cosmos is a theophany revealing God's energies; matter is good and sacramental.","The universe is the expression of Divine Mind; creation is good and ongoing; all is spiritual in essence."]},{"category":"Human Problem","question":"What is wrong with humanity?","answers":["Romans 3:23; Romans 5:12; Isaiah 59:2","ACIM T-2.I.1 ACIM W-93.1","Law of One 10.14 Law of One 50.7","Ignorance, misalignment, or false beliefs; lack of awareness of one’s true spiritual nature.","Ignorance of one’s true divine origin; entrapment of the divine spark in matter.","Original sin inherited from Adam wounds human nature; not total depravity but a loss of grace, remedied by baptism.","Primary problem is personal sin, disobedience, and guilt before a holy God.","Sin as rebellion and broken relationship with God, both personal and systemic.","Broken because Adam's sin brought death; humans need Jehovah's arrangement to be restored.","Humanity fell into sin through Adam, bringing death and a sinful nature.","Humans fell through Adam but retain divine potential; sin separates from God.","Suffering (dukkha) rooted in craving, attachment, and ignorance of impermanence and no-self.","Ignorance (avidya) of one's true divine Self (Atman) causes bondage to the cycle of rebirth.","Humanity fell through ancestral sin, inheriting mortality and corruption; the divine image is wounded, not destroyed.","Humanity's problem is ignorance of its innate divinity; wrong thinking creates limitation and separation."]},{"category":"Jesus’ Identity","question":"Who is Jesus?","answers":["John 1:1,14; Colossians 2:9; Matthew 16:16","ACIM C-5.2 ACIM T-1.II.3","Law of One 17.11 Law of One 22.26","Highly realized spiritual master or exemplar of ‘Christ consciousness’; model of what all can become.","Heavenly emissary or aeon revealing hidden knowledge; often only appears human (docetic).","Fully God and fully man; second Person of the Trinity, Incarnate Word, Savior and head of the Church.","Unique, eternal Son of God, fully divine and fully human; exclusive Savior.","Same core view, with more focus on Christ’s lordship and relational discipleship.","Jesus is Michael the archangel, God's first and greatest creation, not Almighty God.","Jesus is fully God, the eternal Son and Creator, and humanity's High Priest.","Jesus is the literal firstborn spirit child of God the Father, a separate divine being.","A great enlightened teacher (in Buddhist view), not a savior; sometimes seen as a bodhisattva or awakened being.","Often regarded as an avatar or enlightened master, one of many manifestations of the Divine.","Fully God and fully man; the eternal Logos incarnate, second Person of the Trinity, Savior of the world.","The supreme example of Christ Consciousness; Jesus demonstrated the divine potential in every person."]},{"category":"Cross & Resurrection","question":"What do the cross and resurrection mean?","answers":["1 Corinthians 15:3-4; Romans 4:25; 1 Peter 2:24","ACIM T-3.I.1 ACIM T-19.IV","Law of One 17.11 Law of One 76.9","Cross and resurrection read symbolically as death of ego and awakening of higher self or consciousness.","Crucifixion often symbolic or deceptive; emphasis on escape from material fate rather than atonement.","Sacrificial atonement re-presented in the Mass; bodily resurrection central to salvation and hope.","Substitutionary atonement satisfying God’s justice; bodily resurrection as historical fact.","Multi-faceted atonement (substitution, victory, example), strongly affirming bodily resurrection.","Jesus' ransom sacrifice covers Adamic sin; no bodily resurrection, raised as a spirit.","Christ's death atones for sin; He now ministers in the heavenly sanctuary before His return.","Atonement in Gethsemane and on the cross enables resurrection and exaltation for all.","No doctrine of atoning death or bodily resurrection; liberation comes through one's own awakening, not another's sacrifice.","No atoning crucifixion; liberation (moksha) achieved through knowledge, devotion, or action across lifetimes.","Christ's death and resurrection defeat death and corruption; the resurrection is central to salvation and cosmic renewal.","The crucifixion symbolizes release of the lower self; 'resurrection' is the rising of consciousness to divine awareness."]},{"category":"Salvation","question":"How are people saved?","answers":["Ephesians 2:8-9; John 3:16; Romans 10:9","ACIM T-1.III.1 ACIM W-169.5","Law of One 42.6 Law of One 1.7","By inner awakening, alignment with spiritual laws, and transformation of consciousness.","By acquiring secret knowledge (gnosis) about one’s origin and the cosmic order, enabling escape.","By grace through faith working in love; faith and works together, cooperating with grace through the sacraments; a lifelong process.","By grace through faith in Christ alone, often framed in decisional and assurance language.","By grace through faith leading to lifelong discipleship and transformation; communal as well as individual.","By faith, works, and loyalty to Jehovah's organization; most live forever on paradise earth.","By grace through faith in Christ, evidenced by obedience and Sabbath-keeping.","By grace plus faith, ordinances, and obedience; degrees of glory, potential exaltation.","Liberation (nirvana) attained by following the Eightfold Path; self-effort ends craving and rebirth.","Moksha (liberation) through paths of knowledge, devotion, and action; realizing unity of Atman with Brahman.","Salvation as theosis: by grace, faith, sacraments, and cooperation (synergy), humans grow into union with God.","Salvation is awakening to one's divine nature; realized through right thinking and alignment with Divine Mind."]},{"category":"Knowledge & Truth","question":"What is saving ‘knowledge’?","answers":["John 17:3; John 8:32; 2 Timothy 3:15","ACIM T-3.III.1 ACIM W-42.2","Law of One 1.0 Law of One 15.12","Insight into universal spiritual principles, mind-power, non-dual awareness, or inner divinity.","Esoteric myths and revelations about aeons, the Demiurge, and the soul’s journey.","Truth known through reason and revelation together; Scripture interpreted within Tradition and the Magisterium.","Knowing doctrinal truth and the Bible accurately; strong emphasis on inerrancy.","Relational knowing of Christ plus Scripture; combines doctrine with lived obedience.","Accurate knowledge of Jehovah and the Bible through the organization's teaching.","Truth from Scripture (sola scriptura), with Ellen G. White's writings as a lesser confirming guide.","Knowledge gained through scripture, modern prophets, and personal revelation.","Truth realized directly through insight and meditation; the Buddha urged testing teachings by experience.","Higher knowledge (jnana) of the Self is liberating; distinguished from lower, worldly knowledge.","Truth is known through revelation guarded by Holy Tradition and the mind of the Church, not private judgment.","Truth is spiritual understanding of one's oneness with God, known within through intuition and realization."]},{"category":"Body & Matter","question":"How should we view the body?","answers":["1 Corinthians 6:19-20; Romans 12:1; 1 Corinthians 15:42-44","ACIM T-2.IV.3 ACIM W-72.9","Law of One 41.14 Law of One 61.7","Body is expression or vehicle of consciousness; can be healed or transcended by mental/spiritual work.","Body is a temporary shell or prison; some strands either harshly deny it or treat it as unimportant.","Body is good, a temple of the Holy Spirit; will be resurrected and glorified; matter can convey grace (sacraments).","Body is fallen but will be resurrected; strong moral codes; wary of bodily pleasure.","Body is part of God’s good creation; called to holiness, stewardship, and eventual resurrection.","Body is literal; the dead are unconscious until resurrection to earthly life.","The body is God's temple; healthful living and diet honor God (many are vegetarian).","Body is sacred; spirit and body reunite in resurrection; body key to eternal progression.","Body is impermanent and not-self; not evil but not to be clung to; a vehicle for practice.","Body is a temporary vehicle for the eternal soul across many lives; the Self is not the body.","Body is good and will be resurrected and transfigured; matter conveys grace (icons, sacraments).","The body is the temple of Spirit; healthy and good when the mind is aligned with divine truth."]},{"category":"Kingdom & Future","question":"Where is history going?","answers":["Revelation 21:1-4; Matthew 6:10; 1 Corinthians 15:24-28","ACIM M-1.4 ACIM T-13.XI.7","Law of One 16.50 Law of One 82.10","Ongoing evolution of consciousness; less emphasis on a single climactic judgment, more on cycles of growth.","Return to pre-material spiritual realms beyond the Demiurge’s world; history itself is often devalued.","Kingdom already present in the Church and not yet fulfilled; awaits Christ's return, resurrection, and final judgment.","Strong focus on end-times, final judgment, heaven/hell; often futurist apocalyptic schemes.","God’s kingdom already/not yet; new creation, renewed heavens and earth, communal hope.","Armageddon soon; Christ rules 1,000 years, earth restored to paradise under Jehovah.","Advent (Second Coming) is near; premillennial return, investigative judgment, then new earth.","Second Coming, millennial reign, final judgment into degrees of glory (celestial, etc.).","History is cyclical, not headed to a final consummation; the goal is release from the cycle itself (samsara).","Time moves in vast cyclical ages (yugas); the goal is liberation from the wheel, not a final history.","History moves toward Christ's return, resurrection of the dead, and the transfiguration of creation.","The 'kingdom' is a present inner reality; humanity progressively awakens to heaven here and now."]},{"category":"Nature of God","question":"What is God like?","answers":["Deuteronomy 6:4; John 4:24; Matthew 28:19","ACIM T-4.VII.6 ACIM W-29.1","Law of One 1.0 Law of One 27.13","God is the impersonal Ground of Being, universal consciousness or the One in which all shares.","The true God is a distant, unknowable source; the world's maker (Demiurge) is a lesser, flawed being.","One God in three Persons (Trinity); personal, loving, transcendent yet immanent Creator.","Personal, holy, sovereign Triune God; wholly other than creation.","Personal, loving Triune God who seeks relationship with people.","Jehovah is one Person—the only true God; the Trinity is rejected as unbiblical.","God is a Trinity of three co-eternal Persons; personal and loving Creator.","Godhead is three separate beings; the Father has a physical body; exalted man idea.","Generally non-theistic; no creator God; ultimate reality is nirvana/emptiness rather than a personal deity.","One ultimate reality (Brahman); expressed as personal gods and as the impersonal Absolute; often panentheistic.","One God in three Persons (Trinity); unknowable in essence but truly present through His energies.","God is impersonal Divine Mind/Principle, the one Presence and Power; immanent in all."]},{"category":"Authority","question":"What is the final authority for truth?","answers":["2 Timothy 3:16-17; Isaiah 8:20; John 17:17","ACIM T-8.VIII.1 ACIM W-rV.in.1","Law of One 4.20 Law of One 42.6","Inner intuition, direct mystical experience, or channeled/universal wisdom.","Inner gnosis and hidden revelation; secret teachings above the plain text.","Threefold authority: Scripture, Sacred Tradition, and the Magisterium (Pope and bishops in apostolic succession).","Scripture alone (sola scriptura); inerrant and final; suspicion of extra-biblical sources.","Scripture as supreme, read with reason, tradition and Spirit-led experience.","The Bible plus the Governing Body's interpretation (New World Translation) is authoritative.","Scripture alone is the final authority; the Bible interprets the Bible.","The Bible, Book of Mormon, D&C, Pearl of Great Price, and living prophets.","Authority rests in the Buddha's teaching (Dharma), the community (Sangha), and one's own verified experience.","Scriptural revelation (shruti), sages/gurus, and direct realization; interpreted through recognized traditions.","Scripture, Holy Tradition, Church Fathers, and the seven Ecumenical Councils; conciliar, not papal.","Inner spiritual authority and intuition; Scripture read symbolically as illustrating universal principles."]},{"category":"Origin of Evil","question":"Where does evil come from?","answers":["Genesis 3:1-7; Isaiah 14:12-15; James 1:14-15","ACIM T-2.I.1 ACIM W-70.2","Law of One 26.34 Law of One 60.16","Ignorance, illusion, or misalignment of consciousness rather than moral evil.","The flawed material creation of the Demiurge; entrapment in matter.","Evil is a privation of good; entered through the fall of angels and Adam's sin; God permits it but is not its author.","Rebellion of Satan and the fall of humanity into sin against a holy God.","Broken relationship and human sin, with real spiritual evil at work.","Evil began with Satan's rebellion; sin and death entered through Adam.","Evil arose from Lucifer's rebellion, launching the great controversy between Christ and Satan.","Opposition is necessary for growth; the Fall was a needed step forward, not pure tragedy.","No cosmic evil force; suffering and 'evil' arise from ignorance and craving, generating karma.","Evil/suffering results from ignorance and past karma; part of the play of maya, not an ultimate reality.","Evil is a privation of good; entered through the fall of angels and humanity; God permits but does not cause it.","Evil is not a real power but the absence or misuse of good; the result of ignorant thought."]},{"category":"Afterlife","question":"What happens when we die?","answers":["Hebrews 9:27; J ohn 5:28-29; Revelation 20:11-15","ACIM M-12.5 ACIM T-19.IV","Law of One 3.10 Law of One 50.6","Soul continues its evolution, often via reincarnation, returning to Source.","The soul journeys to escape matter and return to the divine fullness (pleroma).","Particular judgment at death, then Heaven, Hell, or Purgatory; final resurrection and Last Judgment at Christ's return.","Eternal heaven or hell; bodily resurrection and final judgment.","Eternal life with God through Christ; resurrection and restored creation.","The dead are unconscious ('sleep'); no immortal soul; hope is future resurrection to earth.","The dead 'sleep' unconscious until resurrection; there is no eternal torment (annihilationism).","Spirits go to spirit world, then resurrection and assignment to a degree of glory.","Rebirth into various realms driven by karma until nirvana (release from rebirth) is attained.","The soul reincarnates according to karma until it attains moksha and merges with/realizes Brahman.","Soul enters an intermediate state awaiting the general resurrection; heaven and hell as nearness to or distance from God.","Continued conscious existence and growth; 'heaven' and 'hell' are states of consciousness, not places."]},{"category":"Spiritual Practice","question":"How do we grow spiritually?","answers":["Acts 2:42; 2 Peter 3:18; John 15:5","ACIM W-in.1 ACIM T-30.I","Law of One 19.20 Law of One 50.7","Meditation, contemplation and practices that raise awareness/vibration.","Seeking hidden knowledge and awakening the divine spark within.","Sacraments (esp. Eucharist and Confession), Mass, prayer, devotions, fasting, and works of mercy.","Prayer, Scripture, obedience, church attendance and moral discipline.","Discipleship, worship, community and Spirit-empowered transformation.","Study, meeting attendance, preaching (field service), and obedience to Jehovah.","Sabbath worship, prayer, Bible study, healthful living, and sharing the three angels' messages.","Ordinances, temple work, family, scripture study, and obedience to commandments.","Meditation, mindfulness, ethical living, and the Eightfold Path to cultivate wisdom and compassion.","Yoga, meditation, devotion (bhakti), mantra, ritual, and study under a guru.","Liturgy, the Jesus Prayer, fasting, sacraments, and hesychastic prayer aiming at union with God.","Affirmative prayer, meditation, and visualization to align the mind with divine principles."]},{"category":"Purpose of Life","question":"Why are we here?","answers":["Isaiah 43:7; Matthew 22:37-39; 1 Corinthians 10:31","ACIM T-24.VII.6 ACIM W-192.1","Law of One 35.4 Law of One 48.6","To evolve in consciousness and realize unity with the One/divine.","To awaken to one's true origin and escape the material prison.","To know, love, and serve God, and to be happy with Him forever in Heaven (Baltimore Catechism).","To glorify God and obey Him, avoiding sin and awaiting judgment.","To know, love and glorify God and join His redemptive mission.","To vindicate Jehovah's name and sovereignty and live obediently on a paradise earth.","The local church and worldwide movement proclaim the gospel and the Sabbath truth.","To progress toward exaltation and become like God, forming eternal families.","To end suffering and attain enlightenment (nirvana) through wisdom, ethics, and mental discipline.","To fulfill dharma and ultimately attain moksha, realizing one's unity with the Divine.","To grow into the likeness of God (theosis) and share in His divine life through love and communion.","To express and realize one's divine nature, living abundantly in harmony with Divine Mind."]},{"category":"The Problem of Suffering","question":"Why do we suffer?","answers":["Job 1:20-22; Romans 8:18-28; John 9:1-3","ACIM T-27.VIII.6 ACIM W-190.5","Law of One 46.9 Law of One 61.7","Suffering is a lesson or illusion to awaken from; often tied to karma and growth.","Suffering stems from the Demiurge's flawed world and the soul's entrapment in matter.","Suffering has redemptive value when united to Christ's cross; permitted by God and can purify and sanctify.","Suffering results from the fall and sin; God uses it for discipline and His purposes.","Suffering is real but God works through it for good and comfort in Christ.","Suffering is permitted by Jehovah; caused by sin, Satan, and 'time and chance'; ends in the new system.","One life; the dead sleep and are raised at resurrection—reincarnation is rejected.","Suffering and opposition are essential to growth and becoming like God.","Suffering is the first Noble Truth; its cause is craving, and it ends by following the path to liberation.","Suffering results from karma and ignorance; endured and transcended on the path to liberation.","Suffering entered through the fall; can be transfigured and redemptive when united to Christ.","Suffering stems from mistaken belief in separation; dissolves as one aligns thought with divine truth."]},{"category":"Ethics & Morality","question":"What makes something right or wrong?","answers":["Micah 6:8; Exodus 20:1-17; Matthew 22:37-40","ACIM T-1.III.6 ACIM M-4.VI","Law of One 15.21 Law of One 50.7","Alignment with universal law, love, and raising one's vibration/consciousness.","Right is what frees the spirit; morality is secondary to gnosis and awakening.","Natural law plus revealed moral teaching; formed conscience guided by the Church; emphasis on virtue and grace.","God's commands and moral law define right and wrong absolutely.","Grounded in God's character and love; law fulfilled in loving God and neighbor.","Jehovah's standards in the Bible as taught by the organization; strict obedience.","Suffering is part of the great controversy between good and evil; God will end it at the last day.","God's commandments plus modern prophetic counsel; obedience brings blessings.","Ethics grounded in non-harm (ahimsa), the Five Precepts, compassion, and right intention.","Dharma (righteous duty), non-harm, and karma guide morality; duties vary by role and stage of life.","Morality flows from the commandments and the virtues, aimed at purification and union with God.","Right thinking and love; ethics based on the law of cause and effect and expressing one's divinity."]},{"category":"Community & Church","question":"What role does community play?","answers":["Hebrews 10:24-25; Acts 2:42-47; 1 Corinthians 12:12-27","ACIM T-8.IV.5 ACIM T-4.VI.8","Law of One 50.5 Law of One 34.6","Optional community; the path is largely individual and inward.","Loose fellowship of the awakened; the institutional church is often distrusted.","One, holy, catholic, apostolic Church founded by Christ on Peter; visible, hierarchical, and universal.","The local church is vital for worship, doctrine, and accountability.","The church is Christ's body for worship, mission, and mutual growth.","The congregation and worldwide organization are essential; strong communal identity.","God's law, including the Ten Commandments and Sabbath, defines right and wrong.","The ward/stake and temple community are central; family and church tightly linked.","The Sangha (monastic and lay community) preserves and transmits the teaching and supports practice.","Community centered on temple, guru lineages, and family/caste duties; diverse local traditions.","The one holy, catholic, apostolic Church as a communion of local churches led by bishops; conciliar governance.","Spiritual communities and centers (e.g., Unity churches) supporting individual growth; loosely organized."]},{"category":"Reincarnation vs. Resurrection","question":"Do we live once or many times?","answers":["Hebrews 9:27; 1 Corinthians 15:20-22; Daniel 12:2","ACIM M-24.1 ACIM T-19.IV","Law of One 12.31 Law of One 18.6","Reincarnation is common—many lives for the soul's ongoing evolution.","The soul journeys and ascends; some traditions imply repeated embodiment.","Rejects reincarnation; each person lives once, then judgment; awaits bodily resurrection at the end of time.","We live once, then face judgment and bodily resurrection—no reincarnation.","One life, then resurrection and eternal life; reincarnation is rejected.","One life; the dead sleep and await a single resurrection to earthly life.","History is linear—creation, fall, redemption, the great controversy, and a new earth.","One mortal life, then spirit world and resurrection; a pre-mortal existence is affirmed.","Rebirth (not reincarnation of a fixed soul) driven by karma; no permanent self transmigrates.","Reincarnation of the soul (atman) through many bodies until liberation; strongly affirmed.","Rejects reincarnation; affirms one life, then judgment and bodily resurrection at Christ's return.","Commonly accepts reincarnation as the soul's ongoing journey of growth (varies by teacher)."]},{"category":"Time & Cosmology","question":"Is history linear or cyclical?","answers":["Ecclesiastes 3:1; Hebrews 1:10-12; Revelation 21:6","ACIM W-158.3 ACIM T-1.VI.3","Law of One 16.21 Law of One 34.4","History is cyclical—ongoing cycles of growth and evolving consciousness.","Cosmos emanates from the divine fullness; aim is return, not linear progress.","Linear time created by God with a beginning and an end; history moving toward fulfillment in Christ.","History is linear with a definite creation, fall, redemption, and end.","History is linear and purposeful, moving toward God's consummation.","Linear history heading to Armageddon and a restored earthly paradise.","History is linear—creation, the great controversy, Christ's return, and a restored new earth.","Linear plan of salvation from pre-mortal life to eternal exaltation.","Vast cyclical eons of worlds arising and dissolving; no ultimate beginning or single end.","Cyclical cosmic ages (kalpas/yugas) of creation, preservation, and dissolution, repeating endlessly.","Linear time created by God, moving toward fulfillment and the transfiguration of all creation.","An evolving, unfolding universe expressing infinite Divine Mind; progress toward greater awareness."]},{"category":"New Earth","question":"What is the 'New Earth'?","answers":["Revelation 21:1-5; Isaiah 65:17; 2 Peter 3:13","ACIM T-13.VII ACIM W-52.3","Law of One 4.2 Law of One 42.11","Not a literal new planet but a transformed state of consciousness/higher reality.","No renewed physical earth; the goal is escape from matter to the spiritual pleroma.","New heavens and new earth at the end of time; creation renewed and transformed, not destroyed.","A literal new heavens and new earth after final judgment where the redeemed dwell forever.","God's renewed creation where heaven and earth unite and God dwells with His people.","The present earth cleansed and restored to a global paradise where the faithful live forever.","A re-created new earth after the millennium and eradication of sin—home of the redeemed and central to hope.","The earth is celestialized and glorified, becoming the eternal home of exalted beings.","No 'new earth' doctrine; the aim is transcending the cycle of worlds altogether through nirvana.","Worlds dissolve and re-manifest in endless cycles; no single final renewed earth.","Creation will be renewed and transfigured, filled with God's uncreated light at the end of the age.","Earth is progressively spiritualized as human consciousness awakens; 'heaven on earth' realized within."]},{"category":"Heaven & Hell","question":"What happens to the saved and the lost?","answers":["Matthew 25:46; Revelation 20:15; John 14:2-3","ACIM T-18.IX.1 ACIM M-13.1","Law of One 15.12 Law of One 34.6","Heaven and hell are inner states of consciousness, not literal places.","The soul ascends to the pleroma; 'hell' is entrapment in matter and ignorance.","Heaven is eternal communion with God; Hell is eternal separation by one's free choice; Purgatory purifies the saved.","The saved go to eternal heaven; the lost suffer conscious eternal torment in hell.","Eternal life with God for the saved; separation from God for the lost.","The 144,000 rule in heaven; faithful live on paradise earth; the wicked are annihilated, no hellfire.","The redeemed inherit the new earth; the wicked are annihilated (no eternal torment); no burning hell.","Three degrees of glory (celestial, terrestrial, telestial); only sons of perdition are truly lost.","Various heavenly and hellish realms exist but are temporary rebirths, not eternal; nirvana is beyond both.","Temporary heavens (svarga) and hells experienced according to karma before further rebirth.","Heaven and hell are experiences of God's presence-love or judgment; the same divine love, differently received.","Heaven and hell are inner states of consciousness, not literal eternal places."]},{"category":"The Millennium","question":"What is the thousand-year reign?","answers":["Revelation 20:1-6; Isaiah 11:6-9; Daniel 7:27","ACIM M-1.4 ACIM T-1.III.3","Law of One 1.0 Law of One 27.13","Symbolic of an age of raised consciousness rather than a literal reign.","No literal millennium; focus is the soul's escape from the cosmos.","Amillennial; the thousand years is symbolic of the Church age; rejects a literal earthly millennial reign.","A literal 1,000-year reign of Christ on earth (views vary: pre-, post-, amillennial).","Christ's reign fulfilled; interpretations range from literal to symbolic.","Christ and the 144,000 rule 1,000 years while earth is restored to paradise.","The saved reign with Christ in heaven 1,000 years while earth lies desolate; then new earth.","Christ reigns on earth during the Millennium; work for the dead continues.","No concept of a millennium; time unfolds in vast impersonal cosmic cycles.","No millennial doctrine; instead vast recurring world-ages (yugas).","Amillennial; the 'thousand years' is symbolic of the Church age, not a literal earthly reign.","No literal millennium; a symbol of an age of enlightened, harmonious consciousness."]},{"category":"Judgment","question":"How are people judged?","answers":["Revelation 20:11-15; 2 Corinthians 5:10; Hebrews 9:27","ACIM M-15.1 ACIM W-152.1","Law of One 4.20 Law of One 43.16","Karma and self-realization replace external judgment.","No cosmic judgment; liberation comes through gnosis, not verdict.","Particular judgment at death and General Judgment at Christ's return; judged on faith and works of love.","A final judgment before God's throne determines eternal destiny by faith and works.","Believers judged for rewards; all held accountable; salvation secured in Christ.","Jehovah judges during the last days and Millennium; survival of Armageddon and loyalty matter.","The investigative judgment (begun 1844) reviews the records before Christ's return.","Judgment assigns people to degrees of glory based on faith, works, and ordinances.","No divine judge; karma is the impersonal moral law that shapes future rebirths.","Karma automatically determines one's fate; God (in theistic strands) may oversee cosmic justice.","Particular judgment at death and general judgment at Christ's return, according to faith and works.","The 'judgment' is the natural law of cause and effect; no condemning external judge."]},{"category":"Extraterrestrial Life (Aliens)","question":"Are there aliens / extraterrestrial beings?","answers":["Genesis 1:1 Colossians 1:16 Psalm 115:16","ACIM W-in.1 ACIM T-1.II.1","Law of One 16.50 Law of One 82.10","Often affirms benevolent ET/higher-dimensional beings, star seeds, and galactic guides aiding human awakening.","Archons—non-physical cosmic rulers—parallel modern alien ideas as deceptive powers over the material realm.","No official doctrine; extraterrestrial life is permissible to believe; all creation would be under God and redeemable in Christ.","Scripture centers on earth and humanity; no biblical aliens—'UFOs' often seen as demonic deception.","Generally open to God as Creator of all; cautious, viewing many claims as unproven or spiritually deceptive.","No intelligent extraterrestrial life; only spirit creatures (angels, demons) and humans exist by Jehovah's design.","No alien races taught; angels and demons are the only non-human intelligences; UFO claims viewed skeptically.","Other worlds are inhabited; God has created many peopled worlds, and humans may progress to godhood over worlds.","Cosmology includes countless world-systems and beings across many realms; life elsewhere fits naturally.","Scriptures describe many worlds and beings; other life is compatible with the vast cosmos.","No official teaching; other life would be part of God's good creation, not doctrinally addressed.","Other worlds and beings readily accepted; all are expressions of the one infinite Mind."]},{"category":"Attitude Toward Outsiders","question":"How are those who don't share the belief treated?","answers":["2 Timothy 2:24-25 1 Peter 3:15 Mark 12:31","ACIM T-1.III.6 ACIM W-121.1","Law of One 4.20 Law of One 16.61","Pluralistic and tolerant; all paths seen as valid routes up the same mountain; little proselytizing.","The 'unawakened' are seen as ignorant of gnosis, not evil; enlightenment is offered, not forced.","Respect and dialogue; salvation possible for non-Catholics through invincible ignorance and God's grace; called to charity and evangelization.","Outsiders are 'lost' and need conversion; truth defended firmly, sometimes with separation from 'the world.'","Called to love, respect, and evangelize outsiders; engage culture graciously while sharing the gospel.","Kindly evangelized door-to-door; but former members are shunned (disfellowshipped) and outside ties limited.","Outsiders warmly welcomed and evangelized; strong health/community outreach; generally non-coercive.","Actively but respectfully proselytized (missionary program); emphasis on family and befriending non-members.","Tolerant and non-dogmatic; compassion toward all beings; many paths can reduce suffering.","Inclusive and pluralistic; many paths lead toward the one truth ('truth is one, sages call it by many names').","Respectful but holds the Orthodox Church as the fullness of faith; dialogue with charity.","Highly pluralistic; honors truth in all religions as varied expressions of universal principles."]},{"category":"Service of Others","question":"What is the role of serving others?","answers":["Mark 10:45 Galatians 5:13 Matthew 25:35-40","ACIM T-4.VII.6 ACIM W-186.1","Law of One 26.34 Law of One 34.4","Service to others' is a central spiritual path; selfless love raises consciousness and polarity toward the light.","Compassion may aid awakening, but the primary aim is the soul's liberation through knowledge.","Corporal and spiritual works of mercy are central; service to the poor seen as service to Christ.","Service flows from obedience and love; caring for others is a duty and witness of true faith.","Self-giving love and service to others reflect Christ and are central to the Christian life.","Service centers on preaching (ministry) and supporting the congregation; charity flows through the organization.","Service and compassion are emphasized—health, education, and humanitarian aid are hallmarks of the church.","Service is a covenant duty; extensive welfare, volunteering, and missionary service are core practices.","Compassion (karuna) and loving-kindness (metta) toward all beings are central; bodhisattva ideal serves others.","Selfless service (seva) and generosity (dana) are important spiritual practices.","Love of neighbor and almsgiving flow from love of God; philanthropy and hospitality valued.","Service expresses divine love; helping others affirms the divinity in all."]},{"category":"Nature of Sin","question":"What is sin?","answers":["Romans 6:23 1 John 3:4 James 4:17","ACIM T-19.II ACIM W-259.1","Law of One 15.4 Law of One 50.5","Sin is not a legal offense but misalignment, low vibration, or separation from unity/consciousness.","Sin is largely ignorance—forgetfulness of one's divine origin—rather than moral guilt.","Distinguishes mortal sin (breaks grace) from venial sin; forgiven through Confession and God's mercy.","Sin is willful transgression of God's law—real guilt deserving eternal punishment.","Sin is both wrong acts and a broken condition that separates us from a holy God.","Sin is disobedience to Jehovah's standards; inherited imperfection from Adam brings sin and death.","Sin is transgression of God's law (1 John 3:4); results from the Fall and personal choice.","Sin is disobedience and falling short; not inherited guilt but individual accountability after the age of eight.","No concept of 'sin' against God; instead unskillful actions rooted in greed, hatred, and delusion generate karma.","Wrong action (adharma) produces negative karma; 'sin' is ignorance-driven error, not offense to a deity.","Sin is a spiritual sickness and missing the mark that wounds the soul, healed through repentance and grace.","Sin is error or 'missing the mark'-mistaken belief in separation-not an offense requiring punishment."]},{"category":"Repentance","question":"What does it mean to repent?","answers":["Acts 3:19 2 Corinthians 7:10 Luke 15:7","ACIM T-5.VII.6 ACIM W-193.13","Law of One 46.9 Law of One 17.20","Repentance is a shift in consciousness or perception, releasing error and realigning with truth/love.","Repentance is inner reorientation—turning from ignorance toward gnosis and remembrance.","Contrition, confession to a priest, and penance; ongoing conversion of heart back to God.","Godly sorrow and turning from sin to God; essential and often urgent before judgment.","A heart change—turning from sin to God in faith—central to conversion and ongoing growth.","Turning around: confessing sin, ceasing wrong conduct, and works in harmony with repentance.","Heartfelt sorrow and turning from sin, with confession and restitution, empowered by the Spirit.","A multi-step process: recognize, feel sorrow, confess, forsake, restore, and keep the commandments.","Recognizing unskillful patterns and reforming the mind through practice; no confession to a deity.","Turning from wrong action to dharma; purification through practice, austerity, and right living.","Repentance (metanoia) is a change of mind and continual turning to God; confession to a priest.","A change of thought (metanoia) turning from error to truth; correcting mistaken beliefs."]},{"category":"Grace & Forgiveness","question":"How are sins forgiven?","answers":["Ephesians 1:7 1 John 1:9 Psalm 103:12","ACIM W-46.1 ACIM T-1.I.3","Law of One 30.5 Law of One 6.1","Forgiveness is releasing illusion and judgment; love and awareness dissolve the sense of error.","Liberation comes through gnosis; 'forgiveness' is really the removal of ignorance, not legal pardon.","Grace is God's gift, mediated through the sacraments; forgiveness received chiefly in Baptism and Confession.","Forgiveness comes only through Christ's blood, received by repentant faith—apart from earned merit.","Grace is God's unmerited favor; forgiveness is a free gift through Christ, producing grateful obedience.","Forgiveness rests on Jesus' ransom; extended to those who repent and stay loyal to Jehovah's requirements.","Grace forgives the penitent through Christ; salvation is by grace, evidenced by obedience.","Grace enables forgiveness after repentance, ordinances, and enduring obedience ('after all we can do').","No divine grace or forgiveness; liberation comes through one's own practice and the ripening of karma.","Grace (kripa) of God or guru aids liberation, especially in devotional (bhakti) paths.","Grace is God's uncreated energy freely given; forgiveness received through repentance and the sacraments.","Forgiveness is releasing false beliefs; divine love is always present and never withheld."]},{"category":"Baptism & Ordinances","question":"What is the role of baptism and rites?","answers":["Matthew 28:19 Acts 2:38 Romans 6:4","ACIM T-19.IV ACIM W-140.1","Law of One 17.11 Law of One 32.2","Rituals are optional aids; transformation happens in consciousness, not through ceremony.","Rites are outward symbols; the true 'sacrament' is inner awakening, not physical ritual.","Seven sacraments (Baptism, Confirmation, Eucharist, Penance, Anointing, Holy Orders, Matrimony) confer real grace; infant baptism practiced.","Baptism is an important obedient step and public witness (views differ on mode/timing).","Baptism and communion are meaningful ordinances symbolizing grace already received.","Baptism (full immersion) marks dedication to Jehovah and is required for approved standing.","Baptism by immersion follows belief; the Lord's Supper and foot-washing are practiced ordinances.","Saving ordinances (baptism, confirmation, temple rites, sealing) are essential, even by proxy for the dead.","No baptism; key rites include taking refuge in the Buddha, Dharma, and Sangha, and ordination for monastics.","Samskaras (life-cycle rites) and initiations; ritual bathing (e.g., in sacred rivers) for purification.","Seven mysteries (sacraments); baptism by triple immersion and chrismation given together, even to infants.","No saving sacraments; symbolic ceremonies (e.g., blessings) may be practiced as affirmations."]},{"category":"Assurance of Salvation","question":"Can a person know they are saved?","answers":["John 5:24 1 John 5:13 Romans 8:16","ACIM T-2.III.5 ACIM W-165.1","Law of One 42.6 Law of One 3.10","Assurance is inner knowing/alignment; there is no external judge to fear.","Certainty grows as gnosis deepens; 'salvation' is realized awakening, not a verdict.","No absolute assurance of final salvation; hopeful confidence while persevering in grace; mortal sin can forfeit salvation.","Assurance is possible but often held with sober self-examination and perseverance.","Believers can have confident assurance of salvation grounded in Christ's finished work.","No absolute assurance now; faithful endurance is required and final salvation is future.","Assurance through Christ, yet with humility; final judgment reviews the life of faith.","No unconditional assurance; exaltation depends on ongoing faithfulness and endurance.","No assurance from an external savior; confidence grows through progress on the path toward liberation.","Confidence rests on realization and grace; ultimate liberation assured only upon moksha.","No presumption of assurance; hopeful perseverance in synergy with grace toward theosis.","Assurance comes from knowing one's inseparable oneness with God; salvation is already one's nature."]},{"category":"Faith vs. Works","question":"Are we saved by faith or works?","answers":["Ephesians 2:8-10 James 2:17 Galatians 2:16","ACIM T-2.V.5 ACIM W-77.1","Law of One 1.7 Law of One 4.20","Growth is by inner realization and alignment; salvation is awakening, not merit.","Liberation is by knowledge (gnosis), not faith or works in the conventional sense.","Faith and works together; justified by grace, with faith made active through love and good works.","Salvation by grace through faith; genuine faith necessarily produces works and obedience.","Saved by grace through faith alone; works are the fruit, not the root, of salvation.","Faith plus works and loyal obedience to Jehovah are necessary for surviving into life.","Saved by grace through faith, with obedience and Sabbath-keeping as faith's fruit.","Grace plus works, ordinances, and endurance ('after all we can do') lead to exaltation.","Emphasis on right effort and skillful action; liberation is achieved through one's own practice, not faith alone.","Multiple valid paths: knowledge, devotion, and works; devotional strands emphasize grace and faith.","Faith and works united in synergy with grace; salvation is a cooperative, transformative process (theosis).","Right thinking expressed in action; 'faith' is spiritual understanding that naturally issues in demonstration."]},{"category":"The Holy Spirit","question":"Who or what is the Holy Spirit?","answers":["John 14:26 Acts 1:8 2 Corinthians 13:14","ACIM T-5.I.1 ACIM C-6.1","Law of One 42.6 Law of One 33.11","The Spirit is universal consciousness or divine energy immanent within and around all.","Often equated with the divine spark or Sophia/wisdom guiding the soul toward gnosis.","Third Person of the Trinity, proceeding from the Father and the Son; given in Baptism and Confirmation; guides the Church.","The Holy Spirit is the third Person of the Trinity—fully God, indwelling believers.","The Spirit is God present and active, empowering, guiding, and transforming believers.","Not a person but Jehovah's impersonal 'active force' used to accomplish His will.","The Holy Spirit is a personal member of the Godhead who convicts, guides, and empowers.","The Holy Ghost is a distinct personage of spirit in the Godhead, a witness and comforter.","No Holy Spirit concept; emphasis on cultivating enlightened mind-states through practice.","No Trinitarian Spirit; comparable to Shakti or divine energy/breath (prana) in some traditions.","Third Person of the Trinity, proceeding from the Father; source of sanctification and life in the Church.","The Holy Spirit is the activity of Divine Mind, the creative and healing presence within all."]},{"category":"Prayer","question":"What is the purpose of prayer?","answers":["Philippians 4:6 Matthew 6:9-13 1 Thessalonians 5:17","ACIM S-1.I.1 ACIM W-183.1","Law of One 15.14 Law of One 42.2","Prayer/meditation is alignment with universal consciousness, affirmation, and attunement.","Prayer is inward ascent and remembrance, reconnecting with the divine within.","Liturgical and personal prayer; the Mass, rosary, and devotions; intercession of Mary and the saints encouraged.","Prayer is reverent communication with God—adoration, confession, and petition—per His will.","Prayer is relational conversation with God, expressing dependence, worship, and requests.","Prayer is directed only to Jehovah through Jesus; not to saints, images, or others.","Prayer is heartfelt communion with God through Christ; intercession and thanksgiving.","Prayer to the Father in Jesus' name; personal and family prayer are strongly emphasized.","Meditation and chanting rather than petition; devotional forms exist (e.g., to bodhisattvas) in some schools.","Prayer, mantra, and devotion (puja) to deities; also silent meditation and contemplation.","Liturgical prayer, the Jesus Prayer, and intercession of the saints and Theotokos (Mary).","Affirmative prayer that aligns thought with divine good, rather than petition to change God."]},{"category":"View of Scripture's Reliability","question":"How reliable and complete is Scripture?","answers":["2 Timothy 3:16 2 Peter 1:21 Revelation 22:18-19","ACIM C-in.4 ACIM T-in.1","Law of One 34.4 Law of One 46.7","Sacred texts are symbolic pointers; inner experience outranks any written authority.","Canonical texts are veiled; hidden/secret gospels reveal deeper truth to the initiated.","Scripture is inspired and without error in matters of salvation; interpreted authoritatively by the Church, not privately.","The Bible is inerrant, verbally inspired, and the complete final authority.","Scripture is inspired and trustworthy; the canon is closed and sufficient.","The Bible is God's Word (via New World Translation), understood through the Governing Body.","The Bible is inspired and reliable; Ellen G. White's writings confirm but never replace it.","The Bible is God's word 'as far as translated correctly,' completed by additional scripture and prophets.","Scriptures are vast and varied; valued as guides but tested by experience rather than treated as inerrant.","Scriptures (shruti) are eternal and authoritative, especially the Vedas; interpreted through tradition.","Scripture is inspired and authoritative, read within Holy Tradition and the Church's interpretation.","Scripture is inspired but read metaphorically as teaching universal spiritual principles, not literal history."]},{"category":"Marriage & Family","question":"What is the view of marriage and family?","answers":["Genesis 2:24 Ephesians 5:22-33 Malachi 2:16","ACIM T-17.V ACIM T-22.in","Law of One 4.20 Law of One 41.19","Relationships are vehicles for growth; forms are flexible, love and consciousness matter most.","Marriage is secondary; some traditions saw procreation/matter as entangling the spirit.","Marriage is a sacrament, permanent and indissoluble; open to life; family is the domestic church.","Marriage is a lifelong male-female covenant; family is central and divinely ordered.","Marriage reflects Christ and the church; family is a key arena of discipleship.","Marriage is honorable and monogamous; family life is ordered under Bible principles.","Marriage and family are sacred; strong emphasis on home, health, and moral order.","Marriage can be eternal (sealed in the temple); family is central to exaltation.","Marriage is a social/lay commitment, not a sacrament; lay life includes family, while monastics are celibate. Compassion and non-attachment guide relationships; family is one arena for practicing loving-kindness.","Marriage (vivaha) is a sacred samskara and dharmic duty, especially for householders; family life (grhastha) is one of the four life-stages. Fidelity, progeny, and joint spiritual duties are emphasized.","Marriage is a holy Mystery (sacrament) crowning husband and wife as an icon of Christ and the Church. Family is a 'little church'; the union is oriented toward salvation and raising children in faith.","Marriage is a loving partnership for mutual spiritual growth and the expression of divine harmony, not a required sacrament. Emphasis is on right relationship, affirmation, and honoring the divinity in one another."]},{"category":"Worship & the Sabbath/Sunday","question":"When and how should worship happen?","answers":["Exodus 20:8-11 Hebrews 10:25 Colossians 2:16-17","ACIM W-183.1 ACIM T-16.VI","Law of One 42.6 Law of One 46.9","Worship is attunement/meditation; no sacred day—every moment can be sacred.","Worship is inward; outer days and forms are unimportant to the awakened.","Sunday (the Lord's Day) worship centered on the Mass; Sunday obligation to attend; feast days and liturgical calendar.","Worship on Sunday (the Lord's Day); reverent, God-centered gatherings.","Worship centered on Christ; Sunday gatherings, though the day is not legalistic.","Regular meetings (not Sabbatarian); worship centers on study and preaching.","Worship on the seventh-day (Saturday) Sabbath is a hallmark and sign of loyalty to God.","Sunday worship (Sabbath observance) with weekly sacrament and temple worship.","No Sabbath; observance follows Uposatha days and festivals rather than a weekly holy day. Practice centers on meditation, chanting, and devotion at temples or home shrines, anytime.","No weekly Sabbath; daily puja, mantra, and meditation plus many festivals and auspicious days. Worship happens at home shrines and temples, morning and evening, and on personal deity days.","Sunday, the Lord's Day, is central, celebrated with the Divine Liturgy and Eucharist. Worship follows a rich liturgical calendar of feasts, fasts, and daily services; Saturday retains some Sabbath honor.","No obligatory Sabbath; worship is affirmative prayer, meditation, and realizing one's oneness with God at any time. Sunday services, silence, and daily spiritual practice cultivate awareness of Divine Mind."]},{"category":"The Devil / Satan","question":"Who or what is Satan?","answers":["Job 1:6-12 John 8:44 1 Peter 5:8 Revelation 12:9","ACIM T-3.VII.5 ACIM W-70.1","Law of One 87.6 Law of One 50.7","Often symbolic—ego, fear, or lower consciousness—rather than a literal personal being.","The Demiurge/archons play the 'adversary' role, ruling the flawed material world.","Satan is a real fallen angel; a personal being who tempts but is limited; Church practices exorcism.","Satan is a real, personal fallen angel—the adversary who tempts and will be judged.","Satan is a real spiritual enemy defeated by Christ, active but ultimately doomed.","Satan is a literal spirit (once Lucifer) who challenged Jehovah and misleads the world.","Satan is a real fallen angel; the 'great controversy' centers on his rebellion vs. Christ.","Satan (Lucifer) is a spirit brother of Christ who rebelled and became the devil.","No personal devil; Mara is a symbolic tempter representing craving, delusion, and death that obstructs awakening. Obstacles arise from one's own mind, not an external evil being.","No single devil; asuras and demonic forces (and inner tendencies, tamas/ego) oppose dharma but are not an ultimate evil rival to God. Evil is bound by karma, not a cosmic adversary.","Satan is a real fallen angel who rebelled against God and tempts humanity. Yet he is a creature, already defeated by Christ's resurrection; believers resist him through prayer, fasting, and the Cross.","No literal devil; 'evil' is error thought, ignorance of one's divine nature, or belief in separation from God. It has no real power and is dissolved by correct, affirmative thinking and awareness of Truth."]},{"category":"Free Will vs. Predestination","question":"Do we have free will or are we predestined?","answers":["Deuteronomy 30:19 Romans 8:29-30 Joshua 24:15","ACIM T-1.IV.2 ACIM T-2.VI.1","Law of One 1.7 Law of One 3.14","Free will is real; the soul co-creates reality and evolves by its choices.","The spark seeks freedom, but the archons/fate bind souls until gnosis liberates them.","Genuine free will cooperating with God's grace; God's grace enables but does not override human freedom.","Views vary; many stress God's sovereign election alongside human responsibility.","Ranges from Calvinist election to Arminian free will; all affirm grace and responsibility.","Humans have free will to choose to serve Jehovah; no fatalistic predestination of individuals.","Genuine free will and moral choice; God foreknows but does not predestine the lost.","Strong emphasis on free agency as central to God's plan; choice is essential to progression.","Neither strict fate nor pure free will; actions unfold through karma and dependent origination. Volition (cetana) is real, and disciplined choice on the path shapes future conditions.","Both: karma conditions circumstances, yet the soul has free will (especially in Vedanta) to choose action and pursue liberation. Divine grace (Ishvara) and effort work together; not rigid fate.","Strong emphasis on free will (synergy): salvation is cooperation between God's grace and human freedom. Rejects absolute predestination; God foreknows but does not force the will.","Strong free will: we co-create our experience through thought and belief (the Law of Mind Action). We are not predestined; conditions change as we change our consciousness and align with Divine Mind."]},{"category":"The Trinity / Godhead","question":"Is God one Being in three Persons?","answers":["Matthew 28:19 John 1:1 2 Corinthians 13:14","ACIM T-3.II.5 ACIM Clarification of Terms","Law of One 1.0 Law of One 4.20","The divine is one impersonal reality; 'persons' are aspects of universal consciousness.","The true God is beyond the Demiurge; emanations (aeons) fill the divine fullness.","One God in three co-equal, co-eternal Persons: Father, Son, and Holy Spirit; central and defined dogma.","Affirms one God in three co-equal, co-eternal Persons (the Trinity).","Affirms the orthodox Trinity: Father, Son, and Holy Spirit, one God.","Rejects the Trinity; only Jehovah is God, Jesus is created, the spirit is a force.","Affirms the Trinity—three co-eternal Persons in one God.","Rejects the Trinity; the Godhead is three separate beings united in purpose.","No Trinity or creator God; non-theistic. Ultimate reality is described as emptiness (sunyata) and the unconditioned (Nibbana), not a personal godhead.","No Trinity, but the Trimurti (Brahma, Vishnu, Shiva) expresses one Brahman in three functions. Advaita Vedanta holds one non-dual reality; many deities are forms of the one Divine.","Affirms the Holy Trinity: one God in three Persons, Father, Son, and Holy Spirit. Holds the original Nicene Creed without the Filioque; the Spirit proceeds from the Father.","God is one Divine Mind or Presence, often described as Spirit, Principle, or Life. The 'Trinity' is reinterpreted metaphysically (e.g., mind-idea-expression, or Father-Son-Holy Spirit as aspects of one Being)."]},{"category":"Angels & Demons","question":"What are angels and demons?","answers":["Hebrews 1:14 Ephesians 6:12 Jude 1:6","ACIM M-23.3 ACIM W-183.1","Law of One 6.7 Law of One 78.19","Often reframed as energies, guides, or ascended beings rather than literal angels/demons.","Archons are hostile cosmic powers; higher aeons aid the soul's ascent.","Angels and demons are real created spiritual beings; guardian angels affirmed; demons are fallen angels.","Real created spirit beings; angels serve God, demons are fallen angels under Satan.","Real personal spirits; angels minister, demons oppose and are defeated in Christ.","Angels are spirit sons of God; demons are angels who joined Satan's rebellion.","Real angels and fallen angels active in the great controversy between good and evil.","Angels are spirits at a stage of God's family; some became demons by following Lucifer.","Devas and other beings inhabit various realms but are impermanent and still bound by samsara, not eternal angels or demons. They are not saviors; even gods must practice to be liberated.","Devas (celestial beings) and asuras/rakshasas exist across many realms, bound by karma and impermanence, not eternal angels or fallen spirits. They are worshipped or appeased but are not ultimate.","Angels are real bodiless powers who serve God and guard people; demons are fallen angels. Icons, guardian angels, and the archangels are venerated within the created spiritual order.","Usually not literal beings; 'angels' are understood as divine ideas, guiding intuitions, or higher thoughts, and 'demons' as negative or error beliefs. Focus is on inner states, not external spirits."]},{"category":"Money & Materialism","question":"How should we view money and possessions?","answers":["1 Timothy 6:10 Matthew 6:24 Proverbs 3:9-10","ACIM T-13.VII.10 ACIM W-133.2","Law of One 46.9 Law of One 18.5","Abundance can be positive energy; attachment and scarcity thinking hinder growth.","Material wealth ties the soul to matter; detachment aids the ascent to spirit.","Wealth is a stewardship; preferential option for the poor; warns against greed; social justice and almsgiving emphasized.","Stewardship under God; warns against greed; tithing/giving emphasized.","Money is a tool for stewardship and generosity; guard against the love of money.","Simple living and generosity; funds support the ministry and the organization.","Stewardship, tithing, and health-conscious simplicity; avoid greed and excess.","Tithing (10%) is a commandment; industriousness and self-reliance are valued.","Wealth is not evil, but attachment and craving for it cause suffering. Right Livelihood and generosity (dana) are encouraged; non-attachment and contentment are the ideal.","Artha (prosperity) is a legitimate life-goal, but greed and attachment bind the soul. Dana (charity), non-attachment (vairagya), and using wealth for dharma are emphasized.","Wealth is a stewardship; love of money is a spiritual danger. Almsgiving, voluntary simplicity, and fasting free the heart from greed; care for the poor is central to Orthodox spirituality.","Prosperity is spiritual and natural; abundance flows from consciousness of divine supply. Wealth is affirmed and welcomed, balanced by generosity, gratitude, and tithing as spiritual principles."]},{"category":"Reincarnation","question":"Do souls return in new bodies?","answers":["Hebrews 9:27 2 Corinthians 5:8 Luke 23:43","ACIM M-24.1 ACIM T-19.IV","Law of One 21.9 Law of One 34.6","Commonly affirmed; souls reincarnate many times to learn and evolve.","Some schools accept transmigration until the soul gains gnosis and escapes.","Reincarnation is rejected; one earthly life followed by judgment and resurrection.","Rejected; humans die once, then judgment—no return in another body.","Rejected; one life then resurrection; reincarnation is incompatible with the gospel.","Rejected; the dead sleep and await one resurrection, not rebirth.","Rejected; death is sleep until the resurrection, not a cycle of rebirths.","Rejected; one mortal life precedes resurrection, though a pre-mortal existence is taught.","Rebirth (not a permanent soul) is central; consciousness continues across lives driven by karma until liberation. This is the cycle of samsara, which awakening (Nibbana) ends.","Reincarnation (samsara) is central: the eternal atman is reborn according to karma until moksha (liberation) unites it with Brahman. Rebirth spans many bodies and lifetimes.","Rejects reincarnation; each person lives once, then faces judgment. The soul awaits the resurrection of the body at Christ's return, not a cycle of rebirths.","Views vary; many in New Thought accept reincarnation as the soul's continuing growth toward full realization of its divine nature, while others emphasize eternal life and ongoing spiritual unfoldment."]},{"category":"The Second Coming","question":"How and when will Christ return?","answers":["Acts 1:11 Matthew 24:30 1 Thessalonians 4:16-17","ACIM T-4.IV.10 ACIM M-28.1","Law of One 17.22 Law of One 6.24","The 'return' is an awakening of Christ consciousness, not a physical event.","No literal bodily return; 'coming' is the soul's inner realization of the Christ within.","Christ will return in glory to judge the living and the dead; timing unknown; no detailed rapture scheme.","A literal, visible, personal return of Christ; imminent and expected with urgency.","Christ will return visibly and personally to judge and renew all things.","Christ's 'presence' began invisibly in 1914; the visible end comes at Armageddon.","A literal, visible, audible Second Coming (Advent) is near—the church's central hope.","Christ will return in glory to reign; preparations and temple work precede it.","No return of Christ; some traditions await Maitreya, the future Buddha, who will appear when the Dharma is forgotten and teach it anew. Not a savior's judgment event.","No Christ return; instead, the avatar doctrine holds the Divine (esp. Vishnu) incarnates in each age to restore dharma. Kalki, the future avatar, is awaited at the end of the current age (Kali Yuga).","Christ will return in glory to judge the living and the dead, as confessed in the Creed. The Second Coming brings the general resurrection and the fullness of the Kingdom; the time is unknown.","The 'Second Coming' is inner and universal: the awakening of Christ Consciousness within each person, not a physical return. It is realized as humanity increasingly expresses its innate divinity."]},{"category":"Who Goes to Heaven","question":"Who is saved and where do they go?","answers":["John 14:2-3 Revelation 7:9 Matthew 7:21","ACIM T-1.III.1 ACIM W-14.1","Law of One 15.12 Law of One 47.3","All souls ultimately return to Source; 'heaven' is a state of expanded consciousness.","Those who attain gnosis ascend; the rest remain bound to the material realm.","Those who die in God's grace and friendship; salvation ordinarily through Christ and the Church, but God's mercy extends beyond visible boundaries.","The redeemed in Christ go to heaven; the unsaved are eternally lost.","All who trust Christ are saved and dwell with God forever.","Only 144,000 go to heaven to rule; the 'great crowd' lives forever on paradise earth.","The redeemed of all ages are saved through Christ and inherit the new earth.","Most inherit a degree of glory; the faithful may reach the celestial kingdom/exaltation.","No heaven as final destination; heavens are pleasant but impermanent rebirth realms. The goal is liberation (Nibbana) from all realms, attained through the path, not divine reward.","Heavens (svarga) and hells are temporary karmic realms, not final destinations. The ultimate goal is moksha, liberation from rebirth and union with Brahman, transcending all heavens.","Salvation is theosis, union with God, offered to all through Christ and the Church. Orthodoxy speaks of the same divine presence experienced as light by the saved and as fire by the unrepentant; God judges mercifully.","Heaven and hell are states of consciousness, not places. 'Salvation' is realizing one's oneness with God here and now; all souls ultimately unfold into fuller awareness of their divine nature."]},{"category":"Health & the Body","question":"How should we care for the body?","answers":["1 Corinthians 6:19-20 1 Corinthians 10:31 3 John 1:2","ACIM W-136.1 ACIM T-8.VII.1","Law of One 61.7 Law of One 41.14","The body is a vehicle of consciousness; holistic health and energy balance are valued.","The body is a prison of the spirit; some practiced asceticism to weaken its hold.","Body is good and cared for; healing sought through prayer, sacraments (Anointing), and medicine; suffering can be redemptive.","The body is God's temple; avoid clear vices, but few dietary rules beyond Scripture.","Stewardship of the body matters; liberty on food/drink with moderation.","Abstain from blood (no transfusions) and tobacco; moderation in alcohol.","The body is God's temple; strong health message—many vegetarian, avoid alcohol/tobacco.","The Word of Wisdom forbids alcohol, tobacco, coffee, and tea; health is a commandment.","The body is impermanent and not-self; treated with mindful care as a vehicle for practice while avoiding both indulgence and harsh asceticism (the Middle Way).","The body is a temple of the atman, cared for through yoga, ayurveda, sattvic diet, and cleanliness. It is a vehicle for spiritual growth, honored but not identified with the true Self.","The body is good and destined for resurrection; it is sanctified through fasting, prostrations, and the sacraments. Ascetic discipline trains body and soul together toward theosis.","The body reflects consciousness; health is our natural, divine state. Healing comes through affirmative prayer and right thinking (spiritual mind healing), aligning the body with the perfection of Divine Mind."]},{"category":"Prophets & Continuing Revelation","question":"Does God still speak through prophets today?","answers":["Amos 3:7 Hebrews 1:1-2 Revelation 22:18-19","ACIM C-in.4 ACIM M-in.1","Law of One 1.0 Law of One 12.26","Revelation is continuous through intuition, channeling, and inner guidance.","Revelation is inner and personal—gnosis unveiled to the individual seeker.","Public revelation closed with the apostles; private revelations possible but not binding; Church discerns their authenticity.","Revelation is complete in Scripture; wary of new prophets or added revelation.","Scripture is sufficient; God guides by the Spirit, but the canon is closed.","The Governing Body provides ongoing guidance as Jehovah's channel today.","The Bible is final; Ellen G. White had a genuine but subordinate prophetic gift.","Living prophets and apostles receive ongoing revelation for the church today.","No ongoing prophetic revelation from a God; the Buddha's Dharma is the guide. Realized teachers and lineage masters transmit and clarify teachings, tested by direct experience.","The Vedas are considered eternal (apaurusheya), revealed to ancient rishis. Living gurus and enlightened sages continue to transmit and interpret truth; direct realization is the highest authority.","Revelation is complete in Christ and preserved in Holy Tradition (Scripture, Councils, Fathers, liturgy). No new public revelation; the Church, guided by the Spirit, faithfully guards the deposit of faith.","Revelation is ongoing and available to all; God/Divine Mind speaks continually through intuition and inner guidance. Founders (e.g., Fillmore, Holmes, Eddy) are teachers, not final prophets; truth is ever-unfolding."]},{"category":"The Lord's Supper / Communion","question":"What is the meaning of communion?","answers":["1 Corinthians 11:23-26 Luke 22:19-20 John 6:53-58","ACIM T-19.IV ACIM W-183.1","Law of One 42.6 Law of One 74.11","A symbolic act of unity; the real 'meal' is communion with universal consciousness.","Sacraments are outward symbols; the true communion is inner union with the divine.","The Eucharist is the true Body and Blood of Christ (transubstantiation); source and summit of Catholic life; celebrated at every Mass.","A symbolic memorial of Christ's death, observed reverently by believers.","A meaningful ordinance remembering Christ; views range from memorial to real presence.","An annual Memorial (Lord's Evening Meal); only the anointed 144,000 partake of the emblems.","The Lord's Supper (with foot-washing) is a memorial observed several times a year, open to all believers.","The weekly sacrament renews baptismal covenants; uses bread and water.","No communion sacrament; offerings of food, flowers, and incense to the Buddha, and communal meals sharing merit, express devotion and gratitude rather than partaking of a body and blood.","No communion sacrament; instead prasad, food offered to a deity in puja and then shared, conveys grace and blessing. Consuming prasad expresses devotion and receipt of divine favor.","The Eucharist (Divine Liturgy) is the center of Orthodox life: the bread and wine truly become the Body and Blood of Christ. It is a Mystery of communion and union with God, received after preparation.","Communion is generally symbolic or optional: bread and wine (or a candle-lighting) represent inwardly receiving the Christ presence and spiritual nourishment. It is a metaphysical, not a literal sacramental, act."]},{"category":"Women in Ministry / Leadership","question":"Can women lead or teach in the church?","answers":["1 Timothy 2:12 Galatians 3:28 Acts 2:17-18","ACIM M-in.1 ACIM T-1.IV.2","Law of One 4.20 Law of One 84.20","Egalitarian; spiritual authority is based on awareness, not gender.","Some traditions honored female figures (e.g., Sophia, Mary Magdalene) as spiritual leaders.","Ordained priesthood reserved to men; women serve in many ministries and religious life but not as priests.","Often restricts ordained leadership/teaching over men to males (complementarian).","Ranges from complementarian to egalitarian; many affirm women in various ministries.","Men serve as elders/ministerial servants; women share in preaching but not eldership.","Women serve widely; ordination of women to ministry is debated within the church.","Priesthood is held by worthy males; women lead auxiliary organizations (e.g., Relief Society).","Women can practice and attain awakening; a bhikkhuni (nuns') order exists, though it is contested or absent in some lineages. Roles and full ordination vary widely by tradition and culture.","Women can be devotees, gurus, and saints, and the Divine is worshipped as Goddess (Shakti). Traditional priestly roles were often male, but many modern and Vedantic movements ordain and honor women teachers.","The priesthood is reserved to men, following apostolic tradition. Women serve vitally as monastics, choir, teachers, and were historically ordained deaconesses; the Theotokos is honored above all saints.","Full equality: women serve as ministers, practitioners, and leaders. New Thought was pioneered by women (e.g., Emma Curtis Hopkins, Myrtle Fillmore, Mary Baker Eddy); gender is no barrier to ministry."]},{"category":"View of Death","question":"What is death?","answers":["Romans 6:23 Ecclesiastes 12:7 1 Corinthians 15:26","ACIM M-12.5 ACIM W-163.1","Law of One 3.10 Law of One 50.6","Death is a transition of consciousness, not an end; the soul continues its journey.","Death can free the spirit from the body—a release from material imprisonment.","Death is the separation of soul and body; the soul faces particular judgment, awaiting bodily resurrection.","Death is the wage of sin and an enemy; the soul faces God immediately after.","Death is real but conquered by Christ; believers are present with the Lord.","Death is a sleep—an unconscious, non-existent state until resurrection.","Death is an unconscious sleep until the resurrection (conditional immortality).","Death separates body and spirit; the spirit enters the spirit world to await resurrection.","Death is impermanence in action and leads to rebirth according to karma, not a final end. Mindfulness of death is a key practice; the goal is to end the cycle of death and rebirth.","Death is the atman shedding one body to take another; not an end but a transition governed by karma. Cremation frees the soul; the goal is moksha, release from the cycle of death and rebirth.","Death is the separation of soul and body, a result of the Fall, but conquered by Christ's resurrection. The soul awaits the final resurrection; prayers, memorials, and hope
