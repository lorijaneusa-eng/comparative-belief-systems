karma. Cremation frees the soul; the goal is moksha, release from the cycle of death and rebirth.","Death is the separation of soul and body, a result of the Fall, but conquered by Christ's resurrection. The soul awaits the final resurrection; prayers, memorials, and hope in Christ surround the departed.","Death is a transition of the eternal soul, not an end; life is continuous and indestructible. The focus is on abundant life now and the soul's ongoing unfoldment beyond the physical body."]},{"category":"Purpose of the Church / Organization","question":"What is the role of the church body?","answers":["Matthew 16:18\nEphesians 4:11-13\nActs 1:8","ACIM M-in.2\nACIM T-8.IV.5","Law of One 1.0\nLaw of One 34.6","Spiritual growth is individual; organizations are optional supports, not authorities.","The true 'church' is the community of the awakened, not an institution.","The Church is the Body of Christ and means of salvation; dispenses grace through the sacraments and teaches with Christ's authority.","To preach the gospel, guard sound doctrine, and disciple believers.","To worship, make disciples, and serve as Christ's body in mission.","The organization is Jehovah's channel; central to teaching, unity, and the preaching work.","To proclaim the three angels' messages, disciple, and serve through health and education.","The restored Church holds priesthood keys and administers saving ordinances.","The Sangha (monastic and lay community) preserves and teaches the Dharma, supports practice, and generates merit. It is one of the Three Jewels, a refuge and support, not a saving institution.","No single church; the temple, guru lineages (parampara), and community (sampradaya) preserve teachings, worship, and dharma. Spiritual authority centers on realized teachers, not one institution.","The Church is the Body of Christ and the ark of salvation, where the faithful are united to God through the Mysteries. It preserves the apostolic faith and worship, leading its members toward theosis.","The church/center is a supportive spiritual community and teaching center that helps people realize their divinity and apply spiritual principles. It is a resource for growth, not a required institution for salvation."]}]};
var LO_DATA = {"13.7-13.13":"13.7 Questioner: After this, what happened?\n\nRa: Awareness led to the focus of infinity into infinite energy. You have called this by various vibrational sound complexes, the most common to your ears being “Logos” or “Love.” The Creator is the focusing of infinity as an aware or conscious principle called by us as closely as we can create understanding/learning in your language, intelligent infinity.\n\n13.8 Questioner: Can you state the next step?\n\nRa: The next step is still at this space/time nexus in your illusion achieving its progression as you may see it in your illusion. The next step is an infinite reaction to the creative principle following the Law of One in one of its primal distortions, freedom of will. Thus many, many dimensions, infinite in number, are possible. The energy moves from the intelligent infinity due first to the outpouring of randomized creative force, this then creating patterns which in holographic style appear as the entire creation no matter which direction or energy is explored. These patterns of energy begin then to regularize their own local, shall we say, rhythms and fields of energy, thus creating dimensions and universes.\n\n13.9 Questioner: Then can you tell me how [the] galaxy and this planetary system were formed?\n\nRa: I am Ra. You must imagine a great leap of thought in this query, for at the last query the physical, as you call, it, universes were not yet born.\n\nThe energies moved in increasingly intelligent patterns until the individualization of various energies emanating from the creative principle of intelligent infinity became such as to be co-Creators. Thus the so-called physical matter began. The concept of light is instrumental in grasping this great leap of thought as this vibrational distortion of infinity is the building block of that which is known as matter, the light being intelligent and full of energy, thus being the first distortion of intelligent infinity which was called by the creative principle.\n\nThis light of love was made to have in its occurrences of being certain characteristics, among them the infinite whole paradoxically described by the straight line, as you would call it. This paradox is responsible for the shape of the various physical illusion entities you call solar systems, galaxies, and planets, all revolving and tending towards the lenticular.\n\n13.10 Questioner: I think I made an error in asking that question, getting ahead of the process that [you were] describing. Would it be helpful to fill in that great leap that I mistakenly made?\n\nRa: I am Ra. I attempted to bridge the gap. However, you may question me in any manner you deem appropriate.\n\n13.11 Questioner: Could you tell me— taking the question previous to the one that I asked about galaxy and planets, would you tell me the next step that occurred after that step?\n\nRa: I am Ra. The steps, as you call them, are, at the point of question, simultaneous and infinite.\n\n13.12 Questioner: Could you tell me how intelligent infinity became, shall we say (I’m having difficulty with some of the language), how intelligent infinity became individualized from itself?\n\nRa: I am Ra. This is an appropriate question.\n\nThe intelligent infinity discerned a concept. This concept was discerned due to freedom of will of awareness. This concept was finity. This was the first and primal paradox or distortion of the Law of One. Thus the one intelligent infinity invested itself in an exploration of many-ness. Due to the infinite possibilities of intelligent infinity there is no ending to many-ness. The exploration, thus, is free to continue infinitely in an eternal present.\n\n13.13 Questioner: Was the galaxy that we are in created by the infinite intelligence or was it created by a portion of the individualized infinite intelligence?\n\nRa: I am Ra. The galaxy and all other things of material of which you are aware are products of individualized portions of intelligent infinity. As each exploration began, it, in turn, found its focus and became co-Creator. Using intelligent infinity each portion created an universe and allowing the rhythms of free choice to flow, playing with the infinite spectrum of possibilities, each individualized portion channeled the love/light into what you might call intelligent energy, thus creating the so-called natural laws of any particular universe.\n\nEach universe, in turn, individualized to a focus becoming, in turn, co-Creator and allowing further diversity, thus creating further intelligent energies regularizing or causing natural laws to appear in the vibrational patterns of what you would call a solar system. Thus, each solar system has its own, shall we say, local coordinate system of illusory natural laws. It shall be understood that any portion, no matter how small, of any density or illusory pattern contains, as in an holographic picture, the One Creator which is infinity. Thus all begins and ends in mystery.","1.0":"1.0 Ra: I am Ra. I have not spoken through this instrument before. We had to wait until she was precisely tuned, as we send a narrow-band vibration. We greet you in the love and in the light of our Infinite Creator.\n\nWe have watched your group. We have been called to your group, for you have a need for the diversity of experiences in channeling which go with a more intensive, or as you might call it, advanced approach to the system of studying the patterns of the illusions of your body, your mind, and your spirit, which you call seeking the truth. We hope to offer you a somewhat different slant upon the information which is always and ever the same.\n\nThe Confederation of Planets in the Service of the Infinite Creator has only one important statement. That statement, my friends, as you know, is “All things, all of life, all of the creation is part of one original thought.”\n\nWe will exercise each channel if we are able to. The reception of our beam is a somewhat more advanced feat than some of the more broad vibration channels opened by other members for more introductory and intermediate work.\n\nLet us for a moment consider thought. What is it, my friends, to take thought? Took you then thought today? What thoughts did you think today? What thoughts were part of the original thought today? In how many of your thoughts did the creation abide? Was love contained? And was service freely given? You are not part of a material universe. You are part of a thought. You are dancing in a ballroom in which there is no material. You are dancing thoughts. You move your body, your mind, and your spirit in somewhat eccentric patterns for you have not completely grasped the concept that you are part of the original thought.\n\nWe would at this time transfer to an instrument known as Don. I am Ra.\n\n[Two-minute pause.]\n\nI am Ra. I am again with this instrument. We are close to initiating a contact but are having difficulty penetrating a certain mental tension and distraction that is somewhat characteristic of this channel. We will therefore describe the type of vibration which is being sent. The instrument will find us entering the energy field at a slight angle towards the back of the top of the head in a narrow but strong area of intensity. We are not able to offer any conditioning due to our own transmitting limitations. Therefore, if the instrument can feel this particular effect he may then speak our thoughts as they come to him. We will again attempt this contact. I am Ra.\n\n[Ninety-second pause.]\n\nThis instrument is resisting our contact. However, we assure her that we are satisfied that contact with the one known as Don is not at this time preferable to that instrument. We will, therefore, move on to the one known as Leonard. Again we caution the instrument that it is a narrow-band communication which is felt as a vibration entering the aura. We will now transfer this contact. I am Ra.\n\n[Ninety-second pause.]\n\nI am Ra. We greet you once more in the love and the light of our Infinite Creator. We ask that you be patient with us, for we are a difficult channel to receive. However, we may perhaps add some dimensions to your understanding.\n\nAt this time we would be glad to attempt to speak to any subject or question which those entities in the room may have potential use in the requesting.","1.7":"1.7 Questioner: [The question was lost because the questioner was sitting too far from the tape recorder to be recorded.]\n\nRa: I am Ra. Consider, if you will, that the universe is infinite. This has yet to be proven or disproven, but we can assure you that there is no end to your selves, your understanding, what you would call your journey of seeking, or your perceptions of the creation.\n\nThat which is infinite cannot be many, for many-ness is a finite concept. To have infinity you must identify or define that infinity as unity; otherwise, the term does not have any referent or meaning. In an Infinite Creator there is only unity. You have seen simple examples of unity. You have seen the prism which shows all colors stemming from the sunlight. This is a simplistic example of unity.\n\nIn truth there is no right or wrong. There is no polarity for all will be, as you would say, reconciled at some point in your dance through the mind/body/spirit complex which you amuse yourself by distorting in various ways at this time. This distortion is not in any case necessary. It is chosen by each of you as an alternative to understanding the complete unity of thought which binds all things. You are not speaking of similar or somewhat like entities or things. You are every thing, every being, every emotion, every event, every situation. You are unity. You are infinity. You are love/light, light/love. You are. This is the Law of One.\n\nMay we enunciate this law in more detail?","3.10":"3.10 Questioner: Then if an individual is totally informed with respect to the Law of One and lives, and is the Law of One, such things as the building of a pyramid by direct mental effort would be commonplace. Is that what I am to understand? Am I correct?\n\nRa: I am Ra. You are incorrect in that there is a distinction between the individual power through the Law of One and the combined, or societal memory complex mind/body/spirit understanding of the Law of One.\n\nIn the first case only the one individual, purified of all flaws, could move a mountain. In the case of mass understanding of unity, each individual may contain an acceptable amount of distortion and yet the mass mind could move mountains. The progress is normally from the understanding which you now seek to a dimension of understanding which is governed by the laws of love, and which seeks the laws of light. Those who are vibrating with the Law of Light seek the Law of One. Those who vibrate with the Law of One seek the Law of Foreverness.\n\nWe cannot say what is beyond this dissolution of the unified self with all that there is, for we still seek to become all that there is, and still are we Ra. Thus our paths go onward.","3.14":"3.14 Questioner: This is slightly trivial, but I was wondering why, in that case, the pyramid was made of many blocks rather than the whole thing being created at once.\n\nRa: I am Ra. There is a law which we believe to be one of the more significant primal distortions of the Law of One. That is the Law of Confusion. You have called this the Law of Free Will. We wished to make an healing machine, or time/space ratio complex which was as efficacious as possible. However, we did not desire to allow the mystery to be penetrated by the peoples in such a way that we became worshiped as builders of a miraculous pyramid. Thus it appears to be made, not thought.","4.2":"4.2 Questioner: Does the shape of the pyramid have effect upon the initiation?\n\nRa: I am Ra. As we began the last session question, you have already recorded in your individual memory complex the first use of the shape having to do with the body complex initiation. The initiation of spirit was a more carefully designed type of initiation as regards the time/space ratios about which the entity to be initiated found itself.\n\nIf you will picture with me the side of the so-called pyramid shape and mentally imagine this triangle cut into four equal triangles, you will find the intersection of the triangle which is at the first level on each of the four sides forms a diamond in a plane which is horizontal. The middle of this plane is the appropriate place for the intersection of the energies streaming from the infinite dimensions and the mind/body/spirit complexes of various interwoven energy fields. Thus it was designed that the one to be initiated would, by mind, be able to perceive and then channel this, shall we say, gateway to intelligent infinity. This, then, was the second point of designing this specific shape.\n\nMay we provide a further description of any kind to your query?","4.20":"4.20 Questioner: My objective is primarily to discover more of the Law of One, and [it would] be very helpful to discover techniques of healing. I am aware of your problem with respect to free will. Can you make… You cannot make suggestions, so I will ask you if you can state the Law of One and the laws of healing to me?\n\nRa: I am Ra. The Law of One, though beyond the limitations of name, as you call vibratory sound complexes, may be approximated by stating that all things are one, that there is no polarity, no right or wrong, no disharmony, but only identity. All is one, and that one is love/light, light/love, the Infinite Creator.\n\nOne of the primal distortions of the Law of One is that of healing. Healing occurs when a mind/body/spirit complex realizes, deep within itself, the Law of One; that is, that there is no disharmony, no imperfection; that all is complete and whole and perfect. Thus, the intelligent infinity within this mind/body/spirit complex re-forms the illusion of body, mind, or spirit to a form congruent with the Law of One. The healer acts as energizer or catalyst for this completely individual process.\n\nOne item which may be of interest is that a healer asking to learn must take the distortion understood as responsibility for that ask/receiving, thus healing. This is a[n] honor/duty which must be carefully considered in free will before the asking.","6.1":"6.1 Questioner: We would like to continue the material from yesterday. We had to cease before [inaudible].\n\nRa: I am Ra. This is well with us.\n\nWe proceed now with the third area of teach/learning concerning the development of the energy powers of healing.\n\nThe third area is the spiritual complex which embodies the fields of force and consciousness which are the least distorted of your mind/body/spirit complex. The exploration and balancing of the spirit complex is indeed the longest and most subtle part of your learn/teaching. We have considered the mind as a tree. The mind controls the body. With the mind single-pointed, balanced, and aware, the body comfortable in whatever biases and distortions make it appropriately balanced for that instrument, the instrument is then ready to proceed with the great work.\n\nThat is the work of wind and fire. The spiritual body energy field is a pathway, or channel. When body and mind are receptive and open, then the spirit can become a functioning shuttle or communicator from the entity’s individual energy of will upwards, and from the streamings of the creative fire and wind downwards.\n\nThe healing ability, like all other, what this instrument would call paranormal abilities, is effected by the opening of a pathway or shuttle into intelligent infinity. There are many upon your plane who have a random hole or gateway in their spirit energy field, sometimes created by the ingestion of chemicals such as, what this instrument would call LSD, who are able, randomly and without control, to tap into energy sources. They may or may not be entities who wish to serve. The purpose of carefully and consciously opening this channel is to serve in a more dependable way, in a more commonplace or usual way, as seen by the distortion complex of the healer. To others there may appear to be miracles. To the one who has carefully opened the door to intelligent infinity this is ordinary; this is commonplace; this is as it should be. The life experience becomes somewhat transformed and the great work goes on.\n\nAt this time we feel these exercises suffice for your beginning. We will, at a future time, when you feel you have accomplished that which is set before you, begin to guide you into a more precise understanding of the functions and uses of this gateway in the experience of healing.","6.24":"6.24 Questioner: Do any of the UFOs that are presently reported come from other planets here at this time, or do you have this knowledge?\n\nRa: I am one of the members of the Confederation of Planets in the Service of the Infinite Creator. There are approximately fifty-three civilizations, comprising approximately five hundred planetary consciousness complexes in this Confederation. This Confederation contains those from your own planet who have attained dimensions beyond your third. It contains planetary entities within your solar system, and it contains planetary entities from other galaxies. It is a true Confederation in that its members are not alike, but allied in service according to the Law of One.","6.7":"6.7 Questioner: How were you able to make the transition from Venus, and I assume the sixth dimension, which— would that be invisible when you reached here? Did you have to change your dimensions to walk on the Earth?\n\nRa: You will remember the exercise of the wind. The dissolution into nothingness is the dissolution into unity, for there is no nothingness. From the sixth dimension, we are capable of manipulating, by thought, the intelligent infinity present in each particle of light or distorted light so that we were able to clothe ourselves in a replica visible in the third density of our mind/body/spirit complexes in the sixth density. We were allowed this experiment by the Council which guards this planet.","10.14":"10.14 Questioner: For general development [of the] reader of this book, could you state some of the practices or exercises to perform to produce an acceleration toward the Law of One?\n\nRa: I am Ra.\n\nExercise One. This is the most nearly centered and usable within your illusion complex. The moment contains love. That is the lesson/goal of this illusion or density. The exercise is to consciously seek that love in awareness and understanding distortions. The first attempt is the cornerstone. Upon this choosing rests the remainder of the life-experience of an entity. The second seeking of love within the moment begins the addition. The third seeking powers the second, the fourth powering or doubling the third. As with the previous type of empowerment, there will be some loss of power due to flaws within the seeking in the distortion of insincerity. However, the conscious statement of self to self of the desire to seek love is so central an act of will that, as before, the loss of power due to this friction is inconsequential.\n\nExercise Two. The universe is one being. When a mind/body/spirit complex views another mind/body/spirit complex, see the Creator. This is an helpful exercise.\n\nExercise Three. Gaze within a mirror. See the Creator.\n\nExercise Four. Gaze at the creation which lies about the mind/body/spirit complex of each entity. See the Creator.\n\nThe foundation or prerequisite of these exercises is a predilection towards what may be called meditation, contemplation, or prayer. With this attitude, these exercises can be processed. Without it, the data will not sink down into the roots of the tree of mind, thus enabling and ennobling the body and touching the spirit.","12.26":"12.26 Questioner: Thank you. Well, you spoke of Wanderers. Who are Wanderers? Where do they come from?\n\nRa: I am Ra. Imagine, if you will, the sands of your shores. As countless as the grains of sand are the sources of intelligent infinity. When a social memory complex has achieved its complete understanding of its desire, it may conclude that its desire is service to others with the distortion towards reaching their hand, figuratively, to any entities who call for aid. These entities whom you may call the Brothers and Sisters of Sorrow move towards this calling of sorrow. These entities are from all reaches of the infinite creation and are bound together by the desire to serve in this distortion.","12.31":"12.31 Questioner: Is there a best way for these entities to heal themselves of their physical ailments?\n\nRa: I am Ra. This will be the last complete question of this time/space.\n\nThe self-healing distortion is effected through realization of the intelligent infinity resting within. This is blocked in some way in those who are not perfectly balanced in bodily complexes. The blockage varies from entity to entity. It requires the conscious awareness of the spiritual nature of reality, if you will, and the corresponding pourings of this reality into the individual mind/body/spirit complex for healing to take place.\n\nWe will use this instrument as example. The portions of its ailment, as you call this distortion complex, that can be perfected in balance are due primarily to a blockage of the indigo-ray or pineal energy center. This center receives the intelligent energy from all sources lawful within the one Creation; that is, lawful in this third-density distortion or illusion. If there is no blockage, these energies pour or stream down into the mind/body/spirit complex perfecting moment by moment the individual’s body complex.\n\nThis instrument also experiences some distortion of the green-ray energy center which you may call the heart center. It is overly open due to an intensive desire distortion on the part of this mind/body/spirit complex towards service to others, or as you may call it, universal love. This entity, therefore, spends itself without regard to its reserves of mind/body/spirit complex distortion in regard to what you call strength or energy. This distortion is primarily due to the blockage of the indigo ray. As we have said before, the misapprehension distortion of the instrument responsible for this blockage is the basic orientation towards a belief in unworthiness. The unworthiness distortion blocks the free flow of intelligent energy.\n\nThe seventh or violet ray is unimpaired, this being not only an energy receptor but a sum total of the vibratory level of the individual. The other energy centers are also quite clear. The solution to healing in this case is action that puts into practice the peaceful understanding in humility distortion that the entity is one with the Creator, therefore perfected and not separate. In each case of what you would call ill health one or more of these energy centers is blocked. The intelligence of the mind/body/spirit complex needs then to be alerted either by the self as healer or by the catalyst of another healer, as we have said before.\n\nIs there a short question before we close this session?","15.12":"15.12 Questioner: How does an individual go about balancing himself? What is the first step?\n\nRa: I am Ra. The steps are only one; that is, an understanding of the energy centers which make up the mind/body/spirit complex. This understanding may be briefly summarized as follows:\n\nThe first balancing is of the Malkuth, or Earth, vibratory energy complex, called the red-ray complex. An understanding and acceptance of this energy is fundamental.\n\nThe next energy complex which may be blocked is the emotional or personal complex, also known as the orange-ray complex. This blockage will often demonstrate itself as personal eccentricities or distortions with regard to self-conscious understanding or acceptance of self.\n\nThe third blockage resembles most closely that which you have called ego. It is the yellow-ray or solar plexus center. Blockages in this center will often manifest as distortions towards power, manipulation, and other social behaviors concerning those close and those associated with the mind/body/spirit complex.\n\nThose with blockages in these first three energy centers, or nexi, will have continuing difficulties in ability to further their seeking of the Law of One.\n\nThe center of heart, or green ray, is the center from which third-density beings may springboard, shall we say, towards infinite intelligence. Blockages in this area may manifest as difficulties in expressing what you may call universal love or compassion.\n\nThe blue-ray center of energy streaming is the center which, for the first time, is outgoing as well as inpouring. Those blocked in this area may have difficulty in grasping the spirit/mind complexes of its own entity and further difficulty in expressing such understandings of self. Entities blocked in this area may have difficulties in accepting communication from other mind/body/spirit complexes.\n\nThe next center is the pineal or indigo-ray center. Those blocked in this center may experience a lessening of the influx of intelligent energy due to manifestations which appear as unworthiness. This is that of which you spoke. As you can see, this is but one of many distortions due to the several points of energy influx into the mind/body/spirit complex. The indigo-ray balancing is quite central to the type of work which revolves about the spirit complex, which has its influx then into the transformation or transmutation of third density to fourth density, it being the energy center receiving the least-distorted outpourings of love/light from intelligent energy and having also the potential for the key to the gateway of intelligent infinity.\n\nThe remaining center of energy influx is simply the total expression of the entity’s vibratory complex of mind, body, and spirit. It is as it will be, “balanced” or “imbalanced” has no meaning at this energy level, for it gives and takes in its own balance. Whatever the distortion may be, it cannot be manipulated as can the others and, therefore, has no particular importance in viewing the balancing of an entity.","15.14":"15.14 Questioner: Yesterday you stated “the harvest is now. There is not at this time any reason to include efforts upon these distortions toward longevity, but rather to encourage distortions towards the heart of self. For this which resides clearly in the violet-ray energy field will determine the harvest of each mind/body/spirit complex.” Could you tell us how to seek or the best way to seek the heart of self?\n\nRa: I am Ra. We have given you this information in several wordings. However, we can only say the material for your understanding is the self: the mind/body/spirit complex. You have been given information upon healing, as you call this distortion. This information may be seen in a more general context as ways to understand the self. The understanding, experiencing, accepting, and merging of self with self and with other-self, and finally with the Creator, is the path to the heart of self. In each infinitesimal part of your self resides the One in all of Its power. Therefore, we can only encourage these lines of contemplation, always stating the prerequisite of meditation, contemplation, or prayer as a means of subjectively/objectively using or combining various understandings to enhance the seeking process. Without such a method of reversing the analytical process, one could not integrate into unity the many understandings gained in such seeking.","15.21":"15.21 Questioner: Well, in yesterday’s material you stated “we offer the Law of One, the solving of paradoxes.” You also mentioned earlier that the first paradox, or the first distortion I meant, was the distortion of free will. Could you tell me if there’s a sequence? Is there a first, second, third, fourth distortion of the Law of One?\n\nRa: I am Ra. Only up to a very short point. After this point, the many-ness of distortions are equal one to another. The first distortion, free will, finds focus. This is the second distortion known to you as Logos, the Creative Principle or Love. This intelligent energy thus creates a distortion known as Light. From these three distortions come many, many hierarchies of distortions, each having its own paradoxes to be synthesized, no one being more important than another.","15.4":"15.4 Questioner: Thank you. The first question is: Why does rapid aging occur on this planet?\n\nRa: I am Ra. Rapid aging occurs upon this third-density planet due to an ongoing imbalance of receptor web complex in the etheric portion of the energy field of this planet. The thought-form distortions of your peoples have caused the energy streamings to enter the planetary magnetic atmosphere, if you would so term this web of energy patterns, in such a way that the proper streamings are not correctly imbued with balanced vibratory light/love from the, shall we say, cosmic level of this octave of existence.","16.21":"16.21 Questioner: Can you give me some kind of history of your social memory complex and how you became aware of the Law of One?\n\nRa: I am Ra. The path of our learning is graven in the present moment. There is no history, as we understand your concept. Picture, if you will, a circle of being. We know the alpha and omega as infinite intelligence. The circle never ceases. It is present. The densities we have traversed at various points in the circle correspond to the characteristics of cycles: first, the cycle of awareness; second, the cycle of growth; third, the cycle of self-awareness; fourth, the cycle of love or understanding; fifth, the cycle of light or wisdom; sixth, the cycle of light/love, love/light, or unity; seventh, the gateway cycle; eighth, the octave which moves into a mystery we do not plumb.","16.50":"16.50 Questioner: Thank you. Is it possible for you to give a small description of the conditions [in] fourth density?\n\nRa: I am Ra. We ask you to consider as we speak that there are no words for positively describing fourth density. We can only explain what is not and approximate what is. Beyond fourth density our ability grows more limited still until we become without words.\n\nThat which fourth density is not: it is not of words, unless chosen. It is not of heavy chemical vehicles for body complex activities. It is not of disharmony within self. It is not of disharmony within peoples. It is not within limits of possibility to cause disharmony in any way.\n\nApproximations of positive statements: it is a plane of a type of bipedal vehicle which is much denser and more full of life; it is a plane wherein one is aware of the thoughts of other-selves; it is a plane where one is aware of the vibrations of other-selves; it is a plane of compassion and understanding of the sorrows of third density; it is a plane striving towards wisdom or light; it is a plane wherein individual differences are pronounced although automatically harmonized by group consensus.","16.61":"16.61 Questioner: And if a Wanderer were to be successfully infringed upon, shall I say, by the Orion group, what would happen to this Wanderer at the harvest?\n\nRa: I am Ra. If the Wanderer entity demonstrated through action a negative orientation towards other-selves it would be as we have said before, caught into the planetary vibration and, when harvested, possibly repeat again the master cycle of third density as a planetary entity. This shall be the last full question of this session.\n\nIs there a short question we may answer before we close the session?","17.11":"17.11 Questioner: Yes. What I meant to say was can you tell me if Jesus of Nazareth came from the Confederation before incarnation here?\n\nRa: I am Ra. The one known to you as Jesus of Nazareth did not have a name. This entity was a member of fifth* density of the highest level of that sub-octave. This entity was desirous of entering this planetary sphere in order to share the love vibration in as pure a manner as possible. Thus, this entity received permission to perform this mission. This entity was then a Wanderer of no name, of Confederation origins, of fifth* density, representing the fifth-density* understanding of the vibration of understanding or love.\n\n* This should be fourth. Ra corrects the error in the next answer.","17.20":"17.20 Questioner: How did this aggressive action against a playmate affect Jesus in his spiritual growth? Where did he go after his physical death?\n\nRa: I am Ra. The entity you call Jesus was galvanized by this experience and began a lifetime of seeking and searching. This entity studied first day and night in its own religious constructs which you call Judaism and was learned enough to be a rabbi, as you call the teach/learners of this particular rhythm or distortion of understanding, at a very young age.\n\nAt the age of approximately thirteen and one-half of your years, this entity left the dwelling place of its earthly family, as you would call it, and walked into many other places seeking further information. This went on sporadically until the entity was approximately twenty-five, at which time it returned to its family dwelling, and learned and practiced the art of its earthly father.\n\nWhen the entity had become able to integrate or synthesize all experiences, the entity began to speak to other-selves and teach/learn what it had felt during the preceding years to be of an worthwhile nature. The entity was absolved karmically of the destruction of an other-self when it was in its last portion of lifetime and spoke upon what you would call a cross saying, “Father, forgive them for they know not what they do.” In forgiveness lies the stoppage of the wheel of action, or what you call karma.","17.22":"17.22 Questioner: In our culture there is a great saying that he will return. Can you tell me if this is planned?\n\nRa: I am Ra. I will attempt to sort out this question. It is difficult. This entity became aware that it was not an entity of itself but operated as a messenger of the One Creator whom this entity saw as love. This entity was aware that this cycle was in its last portion and spoke to the effect that those of its consciousness would return at the harvest.\n\nThe particular mind/body/spirit complex you call Jesus is, as what you would call an entity, not to return except as a member of the Confederation occasionally speaking through a channel. However, there are others of the identical congruency of consciousness that will welcome those to the fourth density. This is the meaning of the returning.","18.5":"18.5 Questioner: Thank you. I have a question here from Jim that I will read verbatim: “Much of the mystic tradition of seeking on Earth holds that belief that the individual self must be erased or obliterated and the material world ignored for an entity to reach ‘nirvana,’ as it’s called, or enlightenment. What is the proper role of the individual self and its worldly activities in aiding an entity to grow more into the Law of One?”\n\nRa: I am Ra. The proper role of the entity is in this density to experience all things desired, to then analyze, understand, and accept these experiences, distilling from them the love/light within them. Nothing shall be overcome. That which is not needed falls away.\n\nThe orientation develops due to analysis of desire. These desires become more and more distorted towards conscious application of love/light as the entity furnishes itself with distilled experience. We have found it to be inappropriate in the extreme to encourage the overcoming of any desires, except to suggest the imagination rather than the carrying out in the physical plane, as you call it, of those desires not consonant with the Law of One; this preserving the primal distortion of free will.\n\nThe reason it is unwise to overcome is that overcoming is an unbalanced action creating difficulties in balancing in the time/space continuum. Overcoming thus creates the further environment for holding onto that which apparently has been overcome.\n\nAll things are acceptable in the proper time for each entity, and in experiencing, in understanding, in accepting, in then sharing with other-selves, the appropriate description shall be moving away from distortions of one kind to distortions of another which may be more consonant with the Law of One.\n\nIt is, shall we say, a shortcut to simply ignore or overcome any desire. It must instead be understood and accepted. This takes patience and experience which can be analyzed with care, with compassion for self and for other-self.","18.6":"18.6 Questioner: Basically I would say that to infringe on the free will of another self or another entity would be the basic thing never to do under the Law of One. Can you state any other breaking of the Law of One than this basic rule?\n\nRa: I am Ra. As one proceeds from the primal distortion of free will, one proceeds to the understanding of the focal points of intelligent energy which have created the intelligences or the ways of a particular mind/body/spirit complex in its environment, both what you would call natural and what you would call man-made. Thus, the distortions to be avoided are those which do not take into consideration the distortions of the focus of energy of love/light, or shall we say, the Logos of this particular sphere or density. These include the lack of understanding of the needs of the natural environment, the needs of other-selves’ mind/body/spirit complexes. These are many due to the various distortions of man-made complexes in which the intelligence and awareness of entities themselves have chosen a way of using the energies available.\n\nThus, what would be an improper distortion with one entity is proper with another. We can suggest an attempt to become aware of the other-self as self and thus do that action which is needed by other-self, understanding from the other-self’s intelligence and awareness. In many cases this does not involve the breaking of the distortion of free will into a distortion or fragmentation called infringement. However, it is a delicate matter to be of service, and compassion, sensitivity, and an ability to empathize are helpful in avoiding the distortions of man-made intelligence and awareness.\n\nThe area or arena called the societal complex is an arena in which there are no particular needs for care for it is the prerogative/honor/duty of those in the particular planetary sphere to act according to its free will for the attempted aid of the social complex.\n\nThus, you have two simple directives: awareness of the intelligent energy expressed in nature, awareness of the intelligent energy expressed in self to be shared, when it seems appropriate, by the entity with the social complex, and you have one infinitely subtle and various set of distortions of which you may be aware; that is, distortions with respect to self and other-selves not concerning free will but concerning harmonious relationships and service to others as other-selves would most benefit.","19.20":"19.20 Questioner: Well, this would seem then that there is a relationship then between what we perceive as physical phenomena, say the electrical phenomena, and the phenomena of consciousness, and that they, having stemmed from the One Creator, are practically identical but have slightly different actions as we [tape ends.] [Is this correct?]\n\nRa: I am Ra. Again we oversimplify to answer your query.\n\nThe physical complex alone is created of many, many energy or electromagnetic fields interacting due to intelligent energy; the mental configurations or distortions of each complex further adding fields of electromagnetic energy and distorting the physical complex patterns of energy; the spiritual aspect serving as a further complexity of fields which is of itself perfect but which can be realized in many distorted and unintegrated ways by the mind and body complexes of energy fields.\n\nThus, instead of one, shall we say, magnet with one polarity you have in the body/mind/spirit complex one basic polarity expressed in what you would call violet-ray energy, the sum of the energy fields, but which is affected by thoughts of all kinds generated by the mind complex, by distortions of the body complex, and by the numerous relationships between the microcosm which is the entity and the macrocosm in many forms which you may represent by viewing the stars, as you call them, each with a contributing energy ray which enters the electromagnetic web of the entity due to its individual distortions.","21.9":"21.9 Questioner: Now, when the 75,000-year cycle started, [the] life span was approximately nine hundred years, average. What was the process and scheduling of— mechanism, shall I say, of reincarnation at that time, and how did the time in between incarnations into third-density physical apply to the growth of the mind/body/spirit complex?\n\nRa: I am Ra. This query is more complex than most. We shall begin. The incarnation pattern of the beginning third-density mind/body/spirit complex begins in darkness, for you may think or consider of your density as one of, as you may say, a sleep and a forgetting. This is the only plane of forgetting. It is necessary for the third-density entity to forget so that the mechanisms of confusion or free will may operate upon the newly individuated consciousness complex.\n\nThus, the beginning entity is one in all innocence oriented towards animalistic behavior using other-selves only as extensions of self for the preservation of the all-self. The entity becomes slowly aware that it has needs, shall we say, that are not animalistic; that is, that are useless for survival. These needs include: the need for companionship, the need for laughter, the need for beauty, the need to know the universe about it. These are the beginning needs.\n\nAs the incarnations begin to accumulate, further needs are discovered: the need to trade, the need to love, the need to be loved, the need to elevate animalistic behaviors to a more universal perspective.\n\nDuring the first portion of third-density cycles, incarnations are automatic and occur rapidly upon the cessation of energy complex of the physical vehicle. There is small need to review or to heal the experiences of the incarnation. As, what you would call, the energy centers begin to be activated to a higher extent, more of the content of experience during incarnation deals with the lessons of love.\n\nThus the time, as you may understand it, between incarnations is lengthened to give appropriate attention to the review and the healing of experiences of the previous incarnation. At some point in third density, the green-ray energy center becomes activated and at that point incarnation ceases to be automatic.","22.26":"22.26 Questioner: I see then. What you’re saying is these naïve Confederation entities had had the same thing happen to them in the past so they were doing the same thing for the Atlantean entities. Is this correct?\n\nRa: I am Ra. This is correct. We remind you that we are one of the naïve members of that Confederation and are still attempting to recoup the damage for which we feel responsibility. It is our duty as well as honor to continue with your peoples, therefore, until all traces of the distortions of our teach/learnings have been embraced by their opposite distortions, and balance achieved.","26.34":"26.34 Questioner: Is it necessary in each case for the entity who is contacted in one of these landings to be calling the Orion group, or do some of these entities come in contact with the Orion group even though they are not calling that group?\n\nRa: I am Ra. You must plumb the depths of fourth-density negative understanding. This is difficult for you. Once having reached third-density space/time continuum through your so-called windows, these crusaders may plunder as they will, the results completely a function of the polarity of the, shall we say, witness/subject or victim.\n\nThis is due to the sincere belief of fourth-density negative that to love self is to love all. Each other-self which is thus either taught or enslaved thus has a teacher which teaches love of self. Exposed to this teaching, it is intended that there be brought to fruition an harvest of fourth-density negative or self-serving mind/body/spirit complexes.","27.13":"27.13 Questioner: Is Love— is there a manifestation of love that we could call vibration?\n\nRa: I am Ra. Again we reach semantic difficulties. The vibration or density of love or understanding is not a term used in the same sense as the second distortion, Love; the distortion Love being the great activator and primal co-Creator of various creations using intelligent infinity; the vibration love being that density in which those who have learned to do an activity called “loving” without significant distortion, then seek the ways of light or wisdom. Thus in vibratory sense love comes into light in the sense of the activity of unity in its free will. Love uses light and has the power to direct light in its distortions. Thus vibratory complexes recapitulate in reverse the creation in its unity, thus showing the rhythm or flow of the great heartbeat, if you will use this analogy.","30.5":"30.5 Questioner: I would like to know how the mind/body/spirit complexes originate. How, going back as far as necessary, does the— Do they originate by spirit forming mind and mind forming body? Can you tell me this?\n\nRa: I am Ra. We ask you to consider that you are attempting to trace evolution. This evolution is as we have previously described, the consciousness being first, in first density, without movement, a random thing. Whether you may call this mind or body complex is a semantic problem. We call it mind/body complex recognizing always that in the simplest iota of this complex exists in its entirety the One Infinite Creator; this mind/body complex then in second density discovering the growing and turning towards the light, thus awakening what you may call the spirit complex, that which intensifies the upward spiraling towards the love and light of the Infinite Creator.\n\nThe addition of this spirit complex, though apparent rather than real, it having existed potentially from the beginning of space/time, perfects itself by graduation into third density. When the mind/body/spirit complex becomes aware of the possibility of service to self or other-self, then the mind/body/spirit complex is activated.","32.2":"32.2 Questioner: Thank you very much. I will now continue with the material from day before yesterday. Our subject is how sexual polarity acts as a catalyst in evolution and how to best make use of this catalyst. Going back to that material, I will fill in a few gaps that we possibly don’t understand at this point too well.\n\nCan you tell me the difference between orange- and yellow-ray activation? I am going to work up from red ray right on through the violet, and we covered red ray, so what’s the difference between orange- and yellow-ray activation?\n\nRa: I am Ra. The orange ray is that influence or vibratory pattern wherein the mind/body/spirit expresses its power on an individual basis. Thus power over individuals may be seen to be orange ray. This ray has been quite intense among your peoples on an individual basis. You may see in this ray the treating of other-selves as non-entities, slaves, or chattel, thus giving other-selves no status whatever.\n\nThe yellow ray is a focal and very powerful ray and concerns the entity in relation to, shall we say, groups, societies, or large numbers of mind/body/spirit complexes. This orange — we correct ourselves — this yellow-ray vibration is at the heart of bellicose actions in which one group of entities feel the necessity and right of dominating other groups of entities and bending their wills to the wills of the masters. The negative path, as you would call it, uses a combination of the yellow ray and the orange ray in its polarization patterns. These rays, used in a dedicated fashion, will bring about a contact with intelligent infinity. The usual nature of sexual interaction, if one is yellow or orange in primary vibratory patterns, is one of blockage and then insatiable hunger due to the blockage. When there are two selves vibrating in this area the potential for polarization through the sexual interaction is begun, one entity experiencing the pleasure of humiliation and slavery or bondage, the other experiencing the pleasure of mastery and control over another entity. In this way a sexual energy transfer of a negative polarity is experienced.","33.11":"33.11 Questioner: This motion picture brought out this point of which we have been talking. And the entity, the Colonel, had to make a decision at that point. I was just wondering, with respect to polarity, his polarization. He could have either knuckled under, you might say, to the negative forces, but he chose to defend his friend instead. Is it possible for you to estimate which is more positively polarizing: to defend the positively oriented entity, or to allow the suppression by the negatively oriented entities? Can you answer this even?\n\nRa: I am Ra. This question takes in the scope of fourth density as well as your own and its answer may best be seen by the action of the entity called Jehoshua, which you call Jesus. This entity was to be defended by its friends. The entity reminded its friends to put away the sword. This entity then delivered itself to be put to the physical death. The impulse to protect the loved other-self is one which persists through the fourth density, a density abounding in compassion. More than this we cannot and need not say.","34.4":"34.4 Questioner: Thank you. Would you define karma?\n\nRa: I am Ra. Our understanding of karma is that which may be called inertia. Those actions which are put into motion will continue using the ways of balancing until such time as the controlling or higher principle which you may liken unto your braking or stopping is invoked. This stoppage of the inertia of action may be called forgiveness. These two concepts are inseparable.","34.6":"34.6 Questioner: Thank you. Can you give me examples of catalytic action to produce learning under each of the following headings from the last session we had… Can you give me an example of the self unmanifested producing learning catalyst?\n\nRa: I am Ra. We observed your interest in the catalyst of pain. This experience is most common among your entities. The pain may be of the physical complex. More often it is of the mental and emotional complex. In some few cases the pain is spiritual in complex-nature. This creates a potential for learning. The lessons to be learned vary. Almost always these lessons include patience, tolerance, and the ability for the light touch.\n\nVery often the catalyst for emotional pain, whether it be the death of the physical complex of one other-self which is loved or some other seeming loss, will simply result in the opposite, in a bitterness, an impatience, a souring. This is catalyst which has gone awry. In these cases, then, there will be additional catalyst provided to offer the unmanifested self further opportunities for discovering the self as all-sufficient Creator containing all that there is and full of joy.","35.4":"35.4 Questioner: I would now like to ask for the same type of information with respect to Adolf Hitler. You have given a little of this already. It is not necessary to re-cover what you have already given, but if you could complete that information it would be helpful.\n\nRa: I am Ra. In speaking of the one you call Adolf we have some difficulty due to the intense amount of confusion present in this entity’s life patterns as well as the great confusion which greets any discussion of this entity.\n\nHere we see an example of one who, in attempting activation of the highest rays of energy while lacking the green-ray key, canceled itself out as far as polarization either towards positive or negative. This entity was basically negative. However, its confusion was such that the personality disintegrated, thus leaving the mind/body/spirit complex unharvestable and much in need of healing.\n\nThis entity followed the pattern of negative polarization which suggests the elite and the enslaved, this being seen by the entity to be of an helpful nature for the societal structure. However, in drifting from the conscious polarization into what you may call a twilight world where dream took the place of events in your space/time continuum, this entity failed in its attempt to serve the Creator in an harvestable degree along the path of service to self. Thus we see the so-called insanity which may often arise when an entity attempts to polarize more quickly than experience may be integrated.\n\nWe have advised and suggested caution and patience in previous communications and do so again, using this entity as an example of the over-hasty opening of polarization without due attention to the synthesized and integrated mind/body/spirit complex. To know your self is to have the foundation upon firm ground.","41.14":"41.14 Questioner: Is this energy center, then, on a very small scale related to the orange energy center in man?\n\nRa: I am Ra. The true color is precisely the same. However, the consciousness of the second-density beginning is primitive and the use of orange ray limited to the expression of self which may be seen to be movement and survival.\n\nIn third density, at this time, those clinging to orange ray have a much more complex system of distortions through which orange ray is manifested. This is somewhat complicated. We shall endeavor to simplify.\n\nThe appropriate true color for third density is, as you have ascertained, yellow. However, the influences of the true color, green, acting upon yellow-ray entities have caused many entities to revert to the consideration of self rather than the stepping forward into consideration of other-self or green ray. This may not be seen to be of a negatively polarized nature, as the negatively polarized entity is working very intensively with the deepest manifestations of yellow-ray group energies, especially the manipulations of other-self for service to self. Those reverting to orange ray, and we may add these are many upon your plane at this time, are those who feel the vibrations of true color green and, therefore, respond by rejecting governmental and societal activities as such and seek once more the self.\n\nHowever, not having developed the yellow ray properly so that it balances the personal vibratory rates of the entity, the entity then is faced with the task of further activation and balancing of the self in relation to the self, thus the orange-ray manifestations at this space/time nexus.\n\nThus true color orange is that which it is, without difference. However, the manifestations of this or any ray may be seen to be most various depending upon the vibratory levels and balances of the mind/body or mind/body/spirit complexes which are expressing these energies.","41.19":"41.19 Questioner: Thank you. In yesterday’s, or the day before yesterday’s session, you mentioned variable speed of rotation or activity of energy centers. What did you mean by that, speed of rotation?\n\nRa: I am Ra. Each energy center has a wide range of rotational speed or as you may see it more clearly in relation to color, brilliance. The more strongly the will of the entity concentrates upon and refines or purifies each energy center, the more brilliant or rotationally active each energy center will be. It is not necessary for the energy centers to be activated in order in the case of the self-aware entity. Thusly entities may have extremely brilliant energy centers while being quite unbalanced in their violet-ray aspect due to lack of attention paid to the totality of experience of the entity.\n\nThe key to balance may then be seen in the unstudied, spontaneous, and honest response of entities toward experiences, thus using experience to the utmost, then applying the balancing exercises and achieving the proper attitude for the most purified spectrum of energy center manifestation in violet ray. This is why the brilliance or rotational speed of the energy centers is not considered above the balanced aspect or violet-ray manifestation of an entity in regarding harvestability; for those entities which are unbalanced, especially as to the primary rays, will not be capable of sustaining the impact of the love and light of intelligent infinity to the extent necessary for harvest.","42.11":"42.11 Questioner: How can an individual assess what energy centers within its being are activated and in no immediate need of further attention and which energy centers are not activated and are in need of immediate attention?\n\nRa: I am Ra. The thoughts of an entity, its feelings or emotions, and least of all its behavior are the signposts for the teaching/learning of self by self. In the analysis of one’s experiences of a diurnal cycle an entity may assess what it considers to be inappropriate thoughts, behaviors, feelings, and emotions.\n\nIn examining these inappropriate activities of mind, body, and spirit complexes the entity may then place these distortions in the proper vibrational ray and thus see where work is needed.","42.2":"42.2 Questioner: I will just read it very rapidly the question, then.\n\nI am going to make a statement and ask you to comment on its degree of accuracy. I am assuming that the balanced entity would not be swayed either towards positive or negative emotions by any situation which he might confront. By remaining unemotional in any situation, the balanced entity may clearly discern the appropriate and necessary responses in harmony with the Law of One for each situation.\n\nMost entities on our planet find themselves unconsciously caught up into every emotional situation which they come in contact with according to their own unique biases and because of these biases are unable to see clearly teach/learning opportunities and appropriate response in each emotional situation and must therefore, through a process of much trial and error and enduring of resulting pain repeat such situations many many times until they become consciously aware of the need to balance their energy centers and thusly their responses and behaviors. Once a person becomes consciously aware of the need to balance their energy centers and responses the next step is to allow the appropriately positive or negative responses to emotional situations to flow smoothly through their being without retaining any of the emotional coloration after it has been consciously observed and allowed to flow through the being. And I am assuming that this ability to consciously observe the positively or negatively charged energy flowing through the being may be augmented by practice of the balancing exercises you have given us with the result in balance being achieved for the entity which would allow him to remain unemotional and undistorted in regards to the Law of One in any situation much like the objective viewer of the television movie.\n\nIs this correct?\n\nRa: I am Ra. This is an incorrect application of the balancing which we have discussed. The exercise of first experiencing feelings and then consciously discovering their antitheses within the being has as its objective not the smooth flow of feelings both positive and negative while remaining unswayed but rather the objective of becoming unswayed. This is a simpler result and takes much practice, shall we say.\n\nThe catalyst of experience works in order for the learn/teachings of this density to occur. However, if there is seen in the being a response, even if it is simply observed, the entity is still using the catalyst for learn/teaching. The end result is that the catalyst is no longer needed. Thus this density is no longer needed. This is not indifference or objectivity but a finely tuned compassion and love which sees all things as love. This seeing elicits no response due to catalytic reactions. Thus the entity is now able to become co-Creator of experiential occurrences. This is the truer balance.","42.6":"42.6 Questioner: In the last session you made the statement that “We, that is Ra, spent much time/space in the fifth density balancing the intense compassion gained in fourth density.” Could you expand on this concept with respect to what we were just discussing?\n\nRa: I am Ra. The fourth density, as we have said, abounds in compassion. This compassion is folly when seen through the eyes of wisdom. It is the salvation of third density but creates a mismatch in the ultimate balance of the entity.\n\nThus we, as a social memory complex of fourth density, had the tendency towards compassion even to martyrdom in aid of other-selves. When the fifth-density harvest was achieved we found that in this vibratory level flaws could be seen in the efficacy of such unrelieved compassion. We spent much time/space in contemplation of those ways of the Creator which imbue love with wisdom.","43.16":"43.16 Questioner: We know that the physical vehicle in fourth density that is used during space/time, I am assuming, is quite similar to the one that we now use in third density. Is this correct?\n\nRa: I am Ra. The chemical elements used are not the same. However, the appearance is similar.","46.7":"46.7 Questioner: I was just wondering, if an entity polarizes toward the service-to-self path, would the anger have the same physical effect that it affects an entity polarized toward the service-to-others path? Would it also cause cancer, or is it just a catalytic effect working in the positively polarized entity?\n\nRa: I am Ra. The catalytic mechanisms are dependent, not upon the chosen polarity of a mind/body/spirit complex, but upon the use or purpose to which this catalysis is put. Thus the entity which uses the experience of anger to polarize consciously positively or negatively does not experience the bodily catalyst but rather uses the catalyst in mental configuration.","46.9":"46.9 Questioner: Certainly.\n\nRa: The entity polarizing positively perceives the anger. This entity, if using this catalyst mentally, blesses and loves this anger in itself. It then intensifies this anger consciously in mind alone until the folly of this red-ray energy is perceived not as folly in itself but as energy subject to spiritual entropy due to the randomness of energy being used.\n\nPositive orientation then provides the will and faith to continue this mentally intense experience of letting the anger be understood, accepted, and integrated with the mind/body/spirit complex. The other-self which is the object of anger is thus transformed into an object of acceptance, understanding, and accommodation, all being reintegrated using the great energy which anger began.\n\nThe negatively oriented mind/body/spirit complex will use this anger in a similarly conscious fashion, refusing to accept the undirected or random energy of anger and instead, through will and faith, funneling this energy into a practical means of venting the negative aspect of this emotion so as to obtain control over other-self, or otherwise control the situation causing anger.\n\nControl is the key to negatively polarized use of catalyst. Acceptance is the key to positively polarized use of catalyst. Between these polarities lies the potential for this random and undirected energy creating a bodily complex analog of what you call the cancerous growth of tissue.","47.3":"47.3 Questioner: We chose the values of— or you were given the values of better than 50% service to others for fourth-density positive and better than 95% service to self for fourth-density negative social memory complexes. Do these two values correspond to the same rate, shall I say, of vibration?\n\nRa: I am Ra. I perceive you have difficulty in expressing your query. We shall respond in an attempt to clarify your query.\n\nThe vibratory rates are not to be understood as the same in positive and negative orientations. They are to be understood as having the power to accept and work with intelligent infinity to a certain degree or intensity. Due to the fact that the primary color, shall we say, or energy blue is missing from the negatively oriented system of power, the green/blue vibratory energies are not seen in the vibratory schedules or patterns of negative fourth and fifth rates of vibration.\n\nThe positive, upon the other hand, shall we say, has the full spectrum of true-color time/space vibratory patterns and thus contains a variant vibratory pattern or schedule. Each is capable of doing fourth-density work. This is the criterion for harvest.","48.6":"48.6 Questioner: Thank you. That cleared it up very well. A very important point. Can you tell me how positive and negative polarizations in fourth and fifth density are used to cause work in consciousness?\n\nRa: I am Ra. There is very little work in consciousness in fourth and in fifth densities compared to the work done in third density. The work that is accomplished in positive fourth is that work whereby the positive social memory complex, having, through slow stages, harmoniously integrated itself, goes forth to aid those of less positive orientation which seek their aid. Thus their service is their work and through this dynamic between the societal self and the other-self which is the object of love, greater and greater intensities of understanding or compassion are attained. This intensity continues until the appropriate intensity of the light may be welcomed. This is fourth-density harvest.\n\nWithin fourth-density positive there are minor amounts of catalyst of a spiritual and mental complex distortion. This occurs during the process of harmonizing to the extent of forming the social memory complex. This causes some small catalyst and work to occur, but the great work of fourth density lies in the contact betwixt the societal self and less polarized other-self.\n\nIn fourth-density negative much work is accomplished during the fighting for position which precedes the period of the social memory complex. There are opportunities to polarize negatively by control of other-selves. During the social memory complex period of fourth-density negative the situation is the same. The work takes place through the societal reaching out to less polarized other-self in order to aid in negative polarization.\n\nIn fifth-density positive and negative the concept of work done through a potential difference is not particularly helpful as fifth-density entities are, again, intensifying rather than potentiating.\n\nIn positive, the fifth-density complex uses sixth-density teach/learners to study the more illuminated understandings of unity thus becoming more and more wise. Fifth-density positive social memory complexes often will choose to divide their service to others in two ways: first, the beaming of light to creation; second, the sending of groups to be of aid as instruments of light such as those whom you’re familiar with through channels.\n\nIn fifth-density negative, service to self has become extremely intense and the self has shrunk or compacted so that the dialogues with the teach/learners are used exclusively in order to intensify wisdom. There are very, very few fifth-density negative Wanderers for they fear the forgetting. There are very, very few fifth-density Orion members for they do not any longer perceive any virtue in other-selves.","50.5":"50.5 Questioner: Will you give that?\n\nRa: I am Ra. We paused to scan this instrument’s consciousness for permission to use its experiential catalyst as example. We may proceed.\n\nThis is one instance and extrapolation may be made to other entities which are aware of the process of evolution. This entity chose, before incarnation, the means whereby catalyst had great probability of being obtained. This entity desired the process of expressing love and light without expecting any return. This instrument programmed also to endeavor to accomplish spiritual work and to comfort itself with companionship in the doing of this work.\n\nAgreements were made prior to incarnation; the first, with the so-called parents and siblings of this entity. This provided the experiential catalyst for the situation of offering radiance of being without expectation of return. The second program involved agreements with several entities. These agreements provided and will provide, in your time/space and space/time continuum, opportunities for the experiential catalyst of work and comradeship.\n\nThere are events which were part of a program for this entity only in that they were possibility/probability vortices having to do with your societal culture. These events include the nature of the living or standard of living, the type of relationships entered into in your legal framework, and the social climate during the incarnation. The incarnation was understood to be one which would take place at harvest.\n\nThese givens, shall we say, apply to millions of your peoples, those aware of evolution and desirous in the very extreme of attaining the heart of love and the radiance which gives understanding. No matter what the lessons programmed, they have to do with other-selves, not with events. They have to do with giving, not receiving, for the lessons of love are of this nature both for positive and negative. Those negatively harvestable will be found at this time endeavoring to share their love of self.\n\nThere are those whose lessons are more random due to their present inability to comprehend the nature and mechanism of the evolution of mind, body, and spirit. Of these we may say that the process is guarded by those who never cease their watchful expectation of being of service. There is no entity without help, either through self-awareness of the unity of creation or through guardians of the self which protect the less sophisticated mind/body/spirit from any permanent separation from unity while the lessons of your density continue.","50.6":"50.6 Questioner: Could you give an example of negative polarization sharing love of self? It would seem to me that that would deplete negative polarization. Could you expand on that concept?\n\nRa: I am Ra. We may not use examples of known beings due to the infringement this would cause. Thus we must be general.\n\nThe negatively oriented being will be one who feels that it has found power that gives meaning to its existence precisely as the positive polarization does feel. This negative entity will strive to offer these understandings to other-selves, most usually by the process of forming the elite, the disciples, and teaching the need and rightness of the enslavement of other-selves for their own good. These other-selves are conceived to be dependent upon the self and in need of the guidance and the wisdom of the self.","50.7":"50.7 Questioner: Thank you. Can you expand on the concept which is this: that it is necessary for an entity to, during incarnation in the physical as we call it, become polarized or interact properly with other entities and why this isn’t possible in between incarnations when he is aware of what he wants to do, but why must he come into an incarnation and lose memory, conscious memory of what he wants to do and then act in a way that he hopes to act? Could you expand on that please?\n\nRa: I am Ra. Let us give the example of the man who sees all the poker hands. He then knows the game. It is but child’s play to gamble, for it is no risk. The other hands are known. The possibilities are known and the hand will be played correctly but with no interest.\n\nIn time/space and in the true-color green density, the hands of all are open to the eye. The thoughts, the feelings, the troubles, all these may be seen. There is no deception and no desire for deception. Thus much may be accomplished in harmony but the mind/body/spirit gains little polarity from this interaction.\n\nLet us re-examine this metaphor and multiply it into the longest poker game you can imagine, a lifetime. The cards are love, dislike, limitation, unhappiness, pleasure, etc. They are dealt and re-dealt and re-dealt continuously. You may, during this incarnation begin — and we stress begin — to know your own cards. You may begin to find the love within you. You may begin to balance your pleasure, your limitations, etc. However, your only indication of other-selves’ cards is to look into the eyes.\n\nYou cannot remember your hand, their hands, perhaps even the rules of this game. This game can only be won by those who lose their cards in the melting influence of love; can only be won by those who lay their pleasures, their limitations, their all upon the table face up and say inwardly: “All, all of you players, each other-self, whatever your hand, I love you.” This is the game: to know, to accept, to forgive, to balance, and to open the self in love. This cannot be done without the forgetting, for it would carry no weight in the life of the mind/body/spirit beingness totality.","60.16":"60.16 Questioner: The pyramid shape then, as I understand it, was deemed by your social memory complex at that time to be of paramount importance as, shall I say, a physical training aid for spiritual development. At this particular time in the evolution of our planet it seems that you place little or no emphasis on this shape. Is this correct?\n\nRa: I am Ra. This is correct. It is our honor/duty to attempt to remove the distortions that the use of this shape has caused in the thinking of your peoples and in the activities of some of your entities. We do not deny that such shapes are efficacious, nor do we withhold the general gist of this efficacy. However, we wish to offer our understanding, limited though it is, that contrary to our naïve beliefs many thousands of your years ago the optimum shape for initiation does not exist.\n\nLet us expand upon this point. When we were aided by sixth-density entities during our own third-density experiences we, being less bellicose in the extreme, found this teaching to be of help. In our naïveté in third density we had not developed the interrelationships of your barter or money system and power. We were, in fact, a more philosophical third-density planet than your own and our choices of polarity were much more centered about the, shall we say, understanding of sexual energy transfers and the appropriate relationships between self and other-self.\n\nWe spent a much larger portion of our space/time working with the unmanifested being. In this less complex atmosphere it was quite instructive to have this learn/teaching device and we benefited without the distortions we found occurring among your peoples.\n\nWe have recorded these differences meticulously in the Great Record of Creation that such naïveté shall not be necessary again.\n\nAt this space/time we may best serve you, we believe, by stating that the pyramid for meditation along with other rounded and arched or pointed circular shapes is of help to you. However, it is our observation that due to the complexity of influences upon the unmanifested being at this space/time nexus among your planetary peoples it is best that the progress of the mind/body/spirit complex take place without, as you call them, training aids because when using a training aid an entity then takes upon itself the Law of Responsibility for the quickened or increased rate of learn/teaching. If this greater understanding, if we may use this misnomer, is not put into practice in the moment-by-moment experience of the entity, then the usefulness of the training aid becomes negative.","61.7":"61.7 Qu
