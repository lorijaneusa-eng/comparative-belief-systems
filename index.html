 in Christ surround the departed.","Death is a transition of the eternal soul, not an end; life is continuous and indestructible. The focus is on abundant life now and the soul's ongoing unfoldment beyond the physical body."]},{"category":"Purpose of the Church / Organization","question":"What is the role of the church body?","answers":["Matthew 16:18 Ephesians 4:11-13 Acts 1:8","ACIM M-in.2 ACIM T-8.IV.5","Law of One 1.0 Law of One 34.6","Spiritual growth is individual; organizations are optional supports, not authorities.","The true 'church' is the community of the awakened, not an institution.","The Church is the Body of Christ and means of salvation; dispenses grace through the sacraments and teaches with Christ's authority.","To preach the gospel, guard sound doctrine, and disciple believers.","To worship, make disciples, and serve as Christ's body in mission.","The organization is Jehovah's channel; central to teaching, unity, and the preaching work.","To proclaim the three angels' messages, disciple, and serve through health and education.","The restored Church holds priesthood keys and administers saving ordinances.","The Sangha (monastic and lay community) preserves and teaches the Dharma, supports practice, and generates merit. It is one of the Three Jewels, a refuge and support, not a saving institution.","No single church; the temple, guru lineages (parampara), and community (sampradaya) preserve teachings, worship, and dharma. Spiritual authority centers on realized teachers, not one institution.","The Church is the Body of Christ and the ark of salvation, where the faithful are united to God through the Mysteries. It preserves the apostolic faith and worship, leading its members toward theosis.","The church/center is a supportive spiritual community and teaching center that helps people realize their divinity and apply spiritual principles. It is a resource for growth, not a required institution for salvation."]}]};
const traditions = DATA.traditions;
const topics = DATA.topics;

let activeTopicIndex = 0;
let activeTraditions = new Set(traditions.map((_, i) => i));
let searchQuery = "";

const navEl = document.getElementById('topicNav');
const mainEl = document.getElementById('mainContent');
const searchInput = document.getElementById('searchInput');

function renderNav() {
  navEl.innerHTML = '';
  topics.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.textContent = t.category;
    if (i === activeTopicIndex && !searchQuery) btn.className = 'active';
    btn.addEventListener('click', () => {
      searchQuery = '';
      searchInput.value = '';
      activeTopicIndex = i;
      renderAll();
      mainEl.scrollTop = 0;
    });
    navEl.appendChild(btn);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const escapedQ = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try {
    const re = new RegExp('(' + escapedQ + ')', 'ig');
    return escaped.replace(re, '<mark>$1</mark>');
  } catch (e) {
    return escaped;
  }
}

function renderTopicView() {
  const topic = topics[activeTopicIndex];
  let html = '';
  html += '<div class="topic-header"><h2>' + escapeHtml(topic.category) + '</h2>';
  if (topic.question) html += '<div class="question">' + escapeHtml(topic.question) + '</div>';
  html += '</div>';
  html += '<div class="tradition-toggle-bar">';
  traditions.forEach((name, i) => {
    html += '<div class="chip ' + (activeTraditions.has(i) ? 'on' : '') + '" data-idx="' + i + '">' + escapeHtml(name) + '</div>';
  });
  html += '</div>';
  html += '<div class="answers-grid">';
  traditions.forEach((name, i) => {
    if (!activeTraditions.has(i)) return;
    const ans = topic.answers[i] || '(no data)';
    html += '<div class="card"><h3>' + escapeHtml(name) + '</h3><p>' + escapeHtml(ans) + '</p></div>';
  });
  html += '</div>';
  mainEl.innerHTML = html;

  mainEl.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const idx = parseInt(chip.dataset.idx, 10);
      if (activeTraditions.has(idx)) activeTraditions.delete(idx);
      else activeTraditions.add(idx);
      renderTopicView();
    });
  });
}

function renderSearchView() {
  const q = searchQuery.toLowerCase();
  const results = [];
  topics.forEach((topic, ti) => {
    const matchedAnswers = [];
    traditions.forEach((name, i) => {
      const ans = topic.answers[i] || '';
      if (ans.toLowerCase().includes(q)) {
        matchedAnswers.push({ name, ans });
      }
    });
    const topicMatches = topic.category.toLowerCase().includes(q) || (topic.question || '').toLowerCase().includes(q);
    if (matchedAnswers.length > 0 || topicMatches) {
      results.push({ ti, topic, matchedAnswers });
    }
  });

  let html = '<div class="topic-header"><h2>Search results</h2><div class="question">' + results.length + ' topic(s) match "' + escapeHtml(searchQuery) + '"</div></div>';
  if (results.length === 0) {
    html += '<div class="empty-state">No matches found. Try a different term.</div>';
  } else {
    html += '<ul class="search-results-list">';
    results.forEach(r => {
      html += '<li>';
      html += '<h3 data-ti="' + r.ti + '">' + highlight(r.topic.category, searchQuery) + '</h3>';
      if (r.topic.question) html += '<div class="q">' + escapeHtml(r.topic.question) + '</div>';
      r.matchedAnswers.slice(0, 4).forEach(m => {
        let snippet = m.ans;
        if (snippet.length > 220) {
          const idx = snippet.toLowerCase().indexOf(q);
          const start = Math.max(0, idx - 60);
          snippet = (start > 0 ? '…' : '') + snippet.slice(start, start + 220) + '…';
        }
        html += '<div class="snippet"><b class="tname">' + escapeHtml(m.name) + ':</b> ' + highlight(snippet, searchQuery) + '</div>';
      });
      if (r.matchedAnswers.length > 4) {
        html += '<div class="snippet">+' + (r.matchedAnswers.length - 4) + ' more traditions match…</div>';
      }
      html += '</li>';
    });
    html += '</ul>';
  }
  mainEl.innerHTML = html;
  mainEl.querySelectorAll('.search-results-list h3').forEach(h => {
    h.addEventListener('click', () => {
      activeTopicIndex = parseInt(h.dataset.ti, 10);
      searchQuery = '';
      searchInput.value = '';
      renderAll();
    });
  });
}

function renderAll() {
  renderNav();
  if (searchQuery) renderSearchView();
  else renderTopicView();
}

let debounceTimer;
searchInput.addEventListener('input', (e) => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    searchQuery = e.target.value.trim();
    renderAll();
  }, 150);
});

renderAll();
</script>
</body>
</html>
